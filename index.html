// ─── CSV parser (Garmin / Strava — summary row OR multi-lap rows) ──────────
function parseActivityCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return null;

  // Auto-detect delimiter (comma or semicolon)
  const delim = lines[0].split(";").length > lines[0].split(",").length ? ";" : ",";
  const headers = lines[0].split(delim).map(h => h.trim().replace(/"/g, ""));

  const dataLines = lines
    .slice(1)
    .filter(l => l.trim().length > 3 && !l.trim().startsWith("#"));
  if (dataLines.length === 0) return null;

  // Parse one CSV row → object (handles quoted fields containing the delimiter)
  const parseRow = (line) => {
    const vals = [];
    let cur = "", inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === delim && !inQ) { vals.push(cur.trim()); cur = ""; }
      else { cur += c; }
    }
    vals.push(cur.trim());
    const obj = {};
    headers.forEach((h, i) => { obj[h] = vals[i] != null ? vals[i] : ""; });
    return obj;
  };

  // Flexible column lookup (case-insensitive partial match)
  const getCol = (row, ...keys) => {
    for (const k of keys) {
      if (row[k] !== undefined && row[k] !== "") return row[k];
      // Case-insensitive fallback
      const found = Object.keys(row).find(h => h.toLowerCase().includes(k.toLowerCase()));
      if (found && row[found] !== "") return row[found];
    }
    return "";
  };

  // Parse "H:MM:SS", "MM:SS", or "H:MM:SS.s" → decimal minutes
  const toMins = (s) => {
    if (!s) return 0;
    const parts = s.replace(/\.\d+$/, "").split(":").map(Number);
    if (parts.length === 3) return parts[0] * 60 + parts[1] + parts[2] / 60;
    if (parts.length === 2) return parts[0] + parts[1] / 60;
    return 0;
  };

  const toFloat = (s) => parseFloat((s || "0").replace(",", ".")) || 0;
  const toInt   = (s) => parseInt((s || "0").replace(/[^0-9]/g, "")) || 0;

  // ── Single-row (activity summary) ──
  if (dataLines.length === 1) {
    const row = parseRow(dataLines[0]);
    const dist        = toFloat(getCol(row, "Distance", "距離"));
    const durationMins = toMins(getCol(row, "Time", "Duration", "Elapsed Time", "タイム"));
    const ascent      = toInt(getCol(row, "Total Ascent", "Elevation Gain", "累計上昇高度", "Ascent"));
    const avgHR       = toInt(getCol(row, "Avg HR", "Average HR", "Average Heart Rate", "平均心拍数"));
    const maxHR       = toInt(getCol(row, "Max HR", "Max Heart Rate", "最高心拍数"));
    const calories    = toInt(getCol(row, "Calories", "カロリー"));
    const title       = getCol(row, "Title", "Activity Name", "アクティビティ名", "Activity Type") || "トレーニングラン";
    const date        = getCol(row, "Date", "Start Time", "日付");
    if (dist === 0 && durationMins === 0) return null;
    return { title, date, dist, durationMins: Math.round(durationMins), ascent, avgHR, maxHR, calories };
  }

  // ── Multi-row (lap / split data) ──
  // Garmin lap CSVs include a "概要" (summary) footer row with authoritative totals.
  // Detect it first — if present, use it directly to avoid double-counting laps.
  const SUMMARY_KEYWORDS = ["概要", "summary", "合計", "total"];
  const isSummaryRow = (line) => {
    const firstVal = line.split(delim)[0].trim().replace(/"/g, "").toLowerCase();
    return SUMMARY_KEYWORDS.some(k => firstVal === k);
  };

  const summaryLine = dataLines.find(isSummaryRow);

  if (summaryLine) {
    // Use the summary row directly as the authoritative result
    const row = parseRow(summaryLine);
    const dist        = toFloat(getCol(row, "Distance", "距離"));
    const durationMins = toMins(getCol(row, "Time", "Moving Time", "Duration", "タイム", "累積時間"));
    const ascent      = toInt(getCol(row, "Elevation Gain", "Ascent", "Total Ascent", "累計上昇高度", "総上昇量"));
    const avgHR       = toInt(getCol(row, "Avg HR", "Average HR", "Average Heart Rate", "平均心拍数"));
    const maxHR       = toInt(getCol(row, "Max HR", "Max Heart Rate", "最高心拍数", "最大心拍数"));
    const calories    = toInt(getCol(row, "Calories", "カロリー"));
    if (dist === 0 && durationMins === 0) return null;
    return {
      title: "トレーニングラン",
      date: "",
      dist: Math.round(dist * 100) / 100,
      durationMins: Math.round(durationMins),
      ascent,
      avgHR,
      maxHR,
      calories,
    };
  }

  // No summary row found → aggregate lap rows (excluding any summary-like rows)
  let totalDist = 0, totalMins = 0, totalAscent = 0, totalCal = 0;
  let hrSum = 0, hrCount = 0, maxHR = 0;
  let title = "", date = "";
  const laps = [];

  dataLines.filter(l => !isSummaryRow(l)).forEach(line => {
    const row = parseRow(line);
    const lapDist   = toFloat(getCol(row, "Distance", "距離km", "距離")) || 1;
    const lapPace   = toMins(getCol(row, "Avg Pace", "Average Pace", "平均ペース分／km", "平均ペース"));
    const lapAscent = toInt(getCol(row, "Elevation Gain", "Ascent", "Total Ascent", "累計上昇高度", "総上昇量"));
    laps.push({ dist: lapDist, paceMin: lapPace, ascent: lapAscent });

    totalDist   += lapDist;
    totalMins   += toMins(getCol(row, "Time", "Moving Time", "Duration", "タイム", "Lap Time", "累積時間"));
    totalAscent += lapAscent;
    totalCal    += toInt(getCol(row, "Calories", "カロリー"));

    const hr  = toInt(getCol(row, "Avg HR", "Average HR", "Average Heart Rate", "平均心拍数"));
    const mhr = toInt(getCol(row, "Max HR", "Max Heart Rate", "最高心拍数", "最大心拍数"));
    if (hr > 0)  { hrSum += hr; hrCount++; }
    if (mhr > maxHR) maxHR = mhr;

    if (!title) title = getCol(row, "Title", "Name", "Activity Type", "Activity Name") || "";
    if (!date)  date  = getCol(row, "Date", "Start Time", "日付") || "";
  });

  if (totalDist === 0 && totalMins === 0) return null;
  return {
    title: title || "トレーニングラン",
    date,
    dist: Math.round(totalDist * 100) / 100,
    durationMins: Math.round(totalMins),
    ascent: totalAscent,
    avgHR: hrCount > 0 ? Math.round(hrSum / hrCount) : 0,
    maxHR,
    calories: totalCal,
    laps,
  };
}

// ─── Analysis engine ───────────────────────────────────────────────────────
function computeAnalysis(runData, nutritionItems, symptoms, runType) {
  const hours = runData.durationMins / 60;
  const isTrail = runType === "trail";

  let totalCarbs = 0, totalWater = 0, totalSodium = 0, totalK = 0, totalMg = 0;
  nutritionItems.forEach(item => {
    const p = NUTRITION_PRESETS.find(x => x.id === item.id);
    const mult = (p?.unit === "ml") ? item.qty / p.defaultQty : item.qty;
    totalCarbs  += (item.carbs  ?? p?.carbs  ?? 0) * mult;
    totalWater  += (item.water  ?? p?.water  ?? 0) * mult;
    totalSodium += (item.sodium ?? p?.sodium ?? 0) * mult;
    totalK      += (item.k      ?? p?.k      ?? 0) * mult;
    totalMg     += (item.mg     ?? p?.mg     ?? 0) * mult;
  });

  // 推奨量 / 時間（エビデンスベース）
  const recCarbsH  = 60;
  const recWaterH  = isTrail ? 500 : 420;
  const recSodiumH = isTrail ? 650 : 500;
  const recKH      = 150;   // mg/hr — 発汗で失うK量の中央値
  const recMgH     = 60;    // mg/hr — 運動中の消費+発汗分

  const recCarbs  = recCarbsH  * hours;
  const recWater  = recWaterH  * hours;
  const recSodium = recSodiumH * hours;
  const recK      = recKH      * hours;
  const recMg     = recMgH     * hours;

  const noData = nutritionItems.length === 0;
  const score = (total, rec) => noData ? 0 : Math.min(100, Math.round((total / rec) * 100));
  const carbScore   = score(totalCarbs,  recCarbs);
  const waterScore  = score(totalWater,  recWater);
  const sodiumScore = score(totalSodium, recSodium);
  const kScore      = score(totalK,      recK);
  const mgScore     = score(totalMg,     recMg);
  const overallScore = Math.round((carbScore + waterScore + sodiumScore + kScore + mgScore) / 5);

  const has = (id) => symptoms.some(s => s.id === id);
  const insights = [];

  if (waterScore < 75 || has("headache") || has("dizziness")) insights.push({
    type: "warn", icon: "💧", title: "水分が不足していました",
    detail: `摂取 ${Math.round(totalWater)}ml ／ 推奨 ${Math.round(recWater)}ml（${recWaterH}ml/時間）`,
    fix: "20〜30分ごとに150〜200mlをこまめに。のどが渇く前に飲む習慣を。",
  });

  if (carbScore < 75 || has("bonk") || has("fatigue")) insights.push({
    type: "warn", icon: "⚡", title: "糖質が不足していました",
    detail: `摂取 ${Math.round(totalCarbs)}g ／ 推奨 ${Math.round(recCarbs)}g（${recCarbsH}g/時間）`,
    fix: "45〜60分ごとにジェル1本（約25g）または固形物で補充を。",
  });

  if (sodiumScore < 75 || has("headache")) insights.push({
    type: "warn", icon: "🧂", title: "ナトリウム（Na）が不足していました",
    detail: `摂取 ${Math.round(totalSodium)}mg ／ 推奨 ${Math.round(recSodium)}mg（${recSodiumH}mg/時間）`,
    fix: "30分ごとに塩タブ1〜2粒。電解質ドリンクと水を交互に飲むのも有効。",
  });

  // K・Mg は攣りと直接紐付けて個別に評価
  if (kScore < 75 || has("cramp")) insights.push({
    type: "warn", icon: "🍌", title: "カリウム（K）が不足していました",
    detail: `摂取 ${Math.round(totalK)}mg ／ 推奨 ${Math.round(recK)}mg（${recKH}mg/時間）`,
    fix: "バナナ1本でK約420mg。電解質ドリンクや塩タブでもKは補給できます。",
  });

  if (mgScore < 75 || has("cramp")) insights.push({
    type: "warn", icon: "💊", title: "マグネシウム（Mg）が不足していました",
    detail: `摂取 ${Math.round(totalMg)}mg ／ 推奨 ${Math.round(recMg)}mg（${recMgH}mg/時間）`,
    fix: "Mg含有の電解質タブレットが有効。ナッツ類・バナナも補給源になります。",
  });

  if (has("gi")) insights.push({
    type: "info", icon: "😟", title: "胃腸の不快感は補給の「密度」が原因かも",
    detail: "高糖度ジェルを短時間に連続摂取すると胃に負担がかかります。",
    fix: "ジェルは必ず水と一緒に。固形物・液体・ジェルを時間軸で分散させましょう。",
  });

  const allGood = carbScore >= 80 && waterScore >= 80 && sodiumScore >= 80 && kScore >= 80 && mgScore >= 80;
  if (insights.length === 0 || allGood) insights.push({
    type: "good", icon: "✅", title: "補給バランスは良好です！",
    detail: "糖質・水分・Na・K・Mg すべてが推奨範囲内。完璧な補給です。",
    fix: "このパターンをベースに、次のレース計画を立てましょう。",
  });

  return {
    totalCarbs: Math.round(totalCarbs), totalWater: Math.round(totalWater),
    totalSodium: Math.round(totalSodium), totalK: Math.round(totalK), totalMg: Math.round(totalMg),
    recCarbs: Math.round(recCarbs), recWater: Math.round(recWater),
    recSodium: Math.round(recSodium), recK: Math.round(recK), recMg: Math.round(recMg),
    carbScore, waterScore, sodiumScore, kScore, mgScore, overallScore, insights,
  };
}

const inputStyle = {
  padding: "10px 12px", borderRadius: "10px", border: "1px solid rgba(148,163,184,0.15)",
  background: "rgba(15,23,42,0.8)", color: "#e2e8f0", fontSize: "13px",
  outline: "none", fontFamily: "inherit", width: "100%",
};

const cardBase = {
  borderRadius: "16px", padding: "16px",
  background: "rgba(30,41,59,0.6)", border: "1px solid rgba(148,163,184,0.1)",
  backdropFilter: "blur(10px)",
};

function fmt(m) {
  return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`;
}

// ─── Nutrition Timeline (Step 4) ────────────────────────────────────────────
function fmtT(mins) {
  return `${Math.floor(mins / 60)}:${String(Math.round(mins % 60)).padStart(2, "0")}`;
}

function segTotals(items) {
  let carbs = 0, na = 0, water = 0;
  (items || []).forEach(item => {
    const p = NUTRITION_PRESETS.find(x => x.id === item.id);
    const mult = p?.unit === "ml" ? item.qty / p.defaultQty : item.qty;
    carbs += (item.carbs  ?? p?.carbs  ?? 0) * mult;
    na    += (item.sodium ?? p?.sodium ?? 0) * mult;
    water += (item.water  ?? p?.water  ?? 0) * mult;
  });
  return { carbs: Math.round(carbs), na: Math.round(na), water: Math.round(water) };
}

function PaceSparkline({ laps, segments, avgPaceMin }) {
  const W = 400, H = 60, PAD = { t: 6, b: 18, l: 4, r: 28 };
  const innerW = W - PAD.l - PAD.r;
  const innerH = H - PAD.t - PAD.b;

  let segPaces;
  if (laps && laps.length > 0 && laps[0].paceMin > 0) {
    let cum = 0;
    const positioned = laps.map(l => { const s = cum; cum += l.dist; return { ...l, s, e: cum }; });
    const totalDist = segments[segments.length - 1]?.endKm || cum;
    segPaces = segments.map(seg => {
      const relevant = positioned.filter(l => l.s < seg.endKm && l.e > seg.startKm);
      if (!relevant.length) return avgPaceMin;
      const tot = relevant.reduce((s, l) => s + Math.min(l.e, seg.endKm) - Math.max(l.s, seg.startKm), 0);
      return relevant.reduce((s, l) => s + l.paceMin * (Math.min(l.e, seg.endKm) - Math.max(l.s, seg.startKm)) / tot, 0);
    });
  } else {
    segPaces = segments.map(() => avgPaceMin);
  }

  const valid = segPaces.filter(p => p > 0 && isFinite(p));
  if (valid.length === 0) return null;
  const minP = Math.min(...valid) * 0.96;
  const maxP = Math.max(...valid) * 1.04;
  const totalDist = segments[segments.length - 1]?.endKm || 1;

  const toX = km => PAD.l + (km / totalDist) * innerW;
  const toY = pace => PAD.t + ((pace - minP) / (maxP - minP || 1)) * innerH;

  const pts = segments.map((seg, i) => ({
    x: toX((seg.startKm + seg.endKm) / 2),
    y: toY(segPaces[i] || avgPaceMin),
  }));
  const pathD = pts.map((p, i) => `${i === 0 ? "M" : "L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const areaD = `${pathD} L${pts[pts.length-1].x},${H-PAD.b} L${pts[0].x},${H-PAD.b} Z`;

  return (
    <div style={{ borderRadius: "12px", background: "rgba(15,23,42,0.6)", border: "1px solid rgba(148,163,184,0.07)", marginBottom: "12px", overflow: "hidden" }}>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ display: "block" }}>
        <defs>
          <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#60a5fa" stopOpacity="0.2" />
            <stop offset="100%" stopColor="#60a5fa" stopOpacity="0" />
          </linearGradient>
        </defs>
        <path d={areaD} fill="url(#pg)" />
        <path d={pathD} fill="none" stroke="#60a5fa" strokeWidth="1.8" strokeLinejoin="round" />
        {pts.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r="2.5" fill="#60a5fa" />)}
        <text x={W - PAD.r + 2} y={PAD.t + 6} fontSize="7" fill="#334155">fast</text>
        <text x={W - PAD.r + 2} y={H - PAD.b} fontSize="7" fill="#334155">slow</text>
        {segments.map(seg => (
          <text key={seg.idx} x={toX(seg.startKm) + 2} y={H - 4} fontSize="7" fill="#334155">{seg.startKm}km</text>
        ))}
      </svg>
    </div>
  );
}

function NutritionTimelineStep({ runData, onDone }) {
  const SEGMENT_KM = 5;
  const { dist, durationMins, laps } = runData;
  const avgPaceMin = durationMins / dist;

  const segments = useMemo(() => {
    const n = Math.ceil(dist / SEGMENT_KM);
    return Array.from({ length: n }, (_, i) => {
      const startKm = i * SEGMENT_KM;
      const endKm = Math.min(startKm + SEGMENT_KM, dist);
      return { idx: i, startKm, endKm, startMins: (startKm / dist) * durationMins, endMins: (endKm / dist) * durationMins };
    });
  }, [dist, durationMins]);

  const [segFuel, setSegFuel] = useState({});
  const [openSeg, setOpenSeg] = useState(null);
  const [showCustomForm, setShowCustomForm] = useState(false);
  const [customDraft, setCustomDraft] = useState({ name: "", carbs: 0, water: 0, sodium: 0, k: 0, mg: 0, qty: 1, unit: "個" });

  function addCustomItem(si) {
    if (!customDraft.name.trim()) return;
    const id = `custom_${Date.now()}`;
    setSegFuel(prev => ({
      ...prev,
      [si]: [...(prev[si] || []), { id, ...customDraft }],
    }));
    setCustomDraft({ name: "", carbs: 0, water: 0, sodium: 0, k: 0, mg: 0, qty: 1, unit: "個" });
    setShowCustomForm(false);
  }

  function toggleItem(si, id) {
    setSegFuel(prev => {
      const cur = prev[si] || [];
      if (cur.find(x => x.id === id)) return { ...prev, [si]: cur.filter(x => x.id !== id) };
      const p = NUTRITION_PRESETS.find(x => x.id === id);
      return { ...prev, [si]: [...cur, { id, qty: p.defaultQty }] };
    });
  }

  function adjustQty(si, id, dir) {
    setSegFuel(prev => ({
      ...prev,
      [si]: (prev[si] || []).map(x => {
        if (x.id !== id) return x;
        const p = NUTRITION_PRESETS.find(p => p.id === id);
        const step = p.unit === "ml" ? (p.defaultQty >= 150 ? 100 : 50) : 1;
        return { ...x, qty: Math.max(step, x.qty + dir * step) };
      }),
    }));
  }

  function flatten() {
    const acc = {};
    Object.values(segFuel).flat().forEach(item => {
      const { id, qty } = item;
      const p = NUTRITION_PRESETS.find(x => x.id === id);
      if (!acc[id]) acc[id] = {
        id, qty: 0,
        carbs:  item.carbs  ?? p?.carbs  ?? 0,
        sodium: item.sodium ?? p?.sodium ?? 0,
        water:  item.water  ?? p?.water  ?? 0,
        k:      item.k      ?? p?.k      ?? 0,
        mg:     item.mg     ?? p?.mg     ?? 0,
      };
      acc[id].qty += qty;
    });
    return Object.values(acc);
  }

  const hours = durationMins / 60;
  const grandTotal = (() => {
    let carbs = 0, na = 0, water = 0;
    flatten().forEach(item => {
      const p = NUTRITION_PRESETS.find(x => x.id === item.id);
      const mult = p?.unit === "ml" ? item.qty / p.defaultQty : item.qty;
      carbs += (item.carbs  ?? 0) * mult;
      na    += (item.sodium ?? 0) * mult;
      water += (item.water  ?? 0) * mult;
    });
    return { carbs: Math.round(carbs), na: Math.round(na), water: Math.round(water) };
  })();

  const ITEM_COLORS = ["#60a5fa","#f59e0b","#6366f1","#8b5cf6","#94a3b8","#b45309","#64748b","#ef4444","#eab308","#ec4899","#f97316","#a3e635"];

  return (
    <div style={{ padding: "28px 20px" }}>
      <div style={{ fontSize: "11px", fontWeight: "700", color: "#64748b", letterSpacing: "2px", textTransform: "uppercase", marginBottom: "8px" }}>STEP 4</div>
      <div style={{ fontSize: "22px", fontWeight: "800", color: "#f1f5f9", marginBottom: "6px" }}>区間ごとの補給は？</div>
      <p style={{ fontSize: "13px", color: "#64748b", marginBottom: "16px", lineHeight: 1.6 }}>
        {dist.toFixed(1)}km · {fmtT(durationMins)} — 各5km区間で補給したものをタップして記録。
      </p>

      <PaceSparkline laps={laps} segments={segments} avgPaceMin={avgPaceMin} />

      {/* Timeline */}
      <div style={{ display: "flex", gap: "8px", overflowX: "auto", paddingBottom: "8px", marginBottom: "4px", WebkitOverflowScrolling: "touch" }}>
        {segments.map(seg => {
          const items = segFuel[seg.idx] || [];
          const isActive = openSeg === seg.idx;
          const isEmpty = items.length === 0;
          return (
            <div key={seg.idx} onClick={() => setOpenSeg(isActive ? null : seg.idx)} style={{
              minWidth: "140px", padding: "12px 10px", borderRadius: "14px", cursor: "pointer", flexShrink: 0,
              background: isActive ? "rgba(99,102,241,0.18)" : isEmpty ? "rgba(30,41,59,0.35)" : "rgba(30,41,59,0.6)",
              border: `1px solid ${isActive ? "rgba(99,102,241,0.45)" : isEmpty ? "rgba(148,163,184,0.08)" : "rgba(34,197,94,0.2)"}`,
              transition: "all 0.15s",
            }}>
              <div style={{ fontSize: "12px", fontWeight: "800", color: isActive ? "#818cf8" : "#f1f5f9", marginBottom: "1px" }}>
                {seg.startKm}–{Number.isInteger(seg.endKm) ? seg.endKm : seg.endKm.toFixed(1)}km
                {isEmpty && <span style={{ marginLeft: "4px" }}>⚠️</span>}
              </div>
              <div style={{ fontSize: "10px", color: "#475569", marginBottom: "8px" }}>{fmtT(seg.startMins)}–{fmtT(seg.endMins)}</div>
              {items.length > 0 ? (
                <div style={{ display: "flex", flexDirection: "column", gap: "3px" }}>
                  {items.map((item) => {
                    const p = NUTRITION_PRESETS.find(x => x.id === item.id);
                    const ci = NUTRITION_PRESETS.findIndex(x => x.id === item.id);
                    const displayName = item.name || p?.name || "?";
                    const displayUnit = item.unit || p?.unit || "";
                    const color = item.id.startsWith("custom_") ? "#f59e0b" : ITEM_COLORS[ci % ITEM_COLORS.length];
                    return (
                      <div key={item.id} style={{ display: "flex", alignItems: "center", gap: "4px", padding: "3px 6px", borderRadius: "20px", fontSize: "10px", background: "rgba(99,102,241,0.12)", border: "1px solid rgba(99,102,241,0.18)", color: "#a5b4fc" }}>
                        <span style={{ width: "6px", height: "6px", borderRadius: "50%", background: color, flexShrink: 0, display: "inline-block" }} />
                        <span style={{ flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{displayName}</span>
                        <span style={{ color: "#64748b", flexShrink: 0 }}>{item.qty}{displayUnit}</span>
                        <span onClick={e => { e.stopPropagation(); toggleItem(seg.idx, item.id); }} style={{ cursor: "pointer", color: "#475569", marginLeft: "2px", fontSize: "11px" }}>×</span>
                      </div>
                    );
                  })}
                </div>
              ) : (
                <div style={{ fontSize: "11px", color: "#334155", paddingTop: "6px" }}>+ タップで追加</div>
              )}
            </div>
          );
        })}
      </div>

      {/* Item picker */}
      {openSeg !== null && segments[openSeg] && (
        <div style={{ borderRadius: "14px", background: "rgba(10,14,23,0.97)", border: "1px solid rgba(99,102,241,0.2)", marginBottom: "16px", overflow: "hidden", marginTop: "8px" }}>
          <div style={{ display: "flex", alignItems: "center", padding: "12px 14px", borderBottom: "1px solid rgba(148,163,184,0.07)" }}>
            <span style={{ fontSize: "13px", fontWeight: "700", color: "#f1f5f9", flex: 1 }}>
              {segments[openSeg].startKm}–{Number.isInteger(segments[openSeg].endKm) ? segments[openSeg].endKm : segments[openSeg].endKm.toFixed(1)}km の補給
            </span>
            <button onClick={() => setOpenSeg(null)} style={{ background: "none", border: "none", color: "#64748b", cursor: "pointer", fontSize: "20px", lineHeight: 1, padding: 0 }}>×</button>
          </div>
          <div style={{ padding: "10px", display: "grid", gridTemplateColumns: "1fr 1fr", gap: "6px" }}>
            {NUTRITION_PRESETS.map((preset, ci) => {
              const sel = (segFuel[openSeg] || []).find(x => x.id === preset.id);
              return (
                <div key={preset.id}>
                  <div onClick={() => toggleItem(openSeg, preset.id)} style={{
                    display: "flex", alignItems: "center", gap: "8px", padding: "10px 12px", borderRadius: "10px", cursor: "pointer",
                    background: sel ? "rgba(99,102,241,0.15)" : "rgba(30,41,59,0.5)",
                    border: `1px solid ${sel ? "rgba(99,102,241,0.3)" : "rgba(148,163,184,0.06)"}`,
                  }}>
                    <div style={{ width: "8px", height: "8px", borderRadius: "50%", flexShrink: 0, background: sel ? ITEM_COLORS[ci % ITEM_COLORS.length] : "#334155" }} />
                    <span style={{ fontSize: "13px", color: sel ? "#c4b5fd" : "#94a3b8", fontWeight: sel ? "700" : "400", flex: 1 }}>{preset.name}</span>
                  </div>
                  {sel && (
                    <div style={{ display: "flex", alignItems: "center", gap: "6px", padding: "4px 8px" }}>
                      <button onClick={() => adjustQty(openSeg, preset.id, -1)} style={{ width: "24px", height: "24px", borderRadius: "6px", border: "none", background: "rgba(148,163,184,0.1)", color: "#94a3b8", cursor: "pointer", fontSize: "15px" }}>−</button>
                      <span style={{ flex: 1, textAlign: "center", fontSize: "12px", fontWeight: "700", color: "#f1f5f9" }}>{sel.qty}{preset.unit}</span>
                      <button onClick={() => adjustQty(openSeg, preset.id, 1)} style={{ width: "24px", height: "24px", borderRadius: "6px", border: "none", background: "rgba(99,102,241,0.15)", color: "#818cf8", cursor: "pointer", fontSize: "15px" }}>＋</button>
                    </div>
                  )}
                </div>
              );
            })}

            {/* Custom item button */}
            <div style={{ gridColumn: "1 / -1" }}>
              {!showCustomForm ? (
                <button onClick={() => setShowCustomForm(true)} style={{
                  width: "100%", padding: "10px 12px", borderRadius: "10px", cursor: "pointer",
                  background: "rgba(245,158,11,0.08)", border: "1px dashed rgba(245,158,11,0.3)",
                  color: "#f59e0b", fontSize: "13px", fontWeight: "700", textAlign: "left",
                }}>
                  ✨ カスタムアイテムを追加
                </button>
              ) : (
                <div style={{ borderRadius: "12px", background: "rgba(245,158,11,0.06)", border: "1px solid rgba(245,158,11,0.2)", padding: "12px", display: "flex", flexDirection: "column", gap: "8px" }}>
                  <div style={{ fontSize: "11px", fontWeight: "700", color: "#f59e0b", marginBottom: "2px" }}>✨ カスタムアイテム</div>

                  {/* Name */}
                  <input
                    placeholder="アイテム名（例：自作ジェル）"
                    value={customDraft.name}
                    onChange={e => setCustomDraft(d => ({ ...d, name: e.target.value }))}
                    style={{ ...inputStyle, fontSize: "12px", padding: "7px 10px" }}
                  />

                  {/* Qty + Unit */}
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "6px" }}>
                    <label style={{ fontSize: "10px", color: "#64748b", display: "flex", flexDirection: "column", gap: "3px" }}>
                      1回の量
                      <input type="number" min="1" value={customDraft.qty}
                        onChange={e => setCustomDraft(d => ({ ...d, qty: +e.target.value || 1 }))}
                        style={{ ...inputStyle, fontSize: "12px", padding: "7px 10px" }} />
                    </label>
                    <label style={{ fontSize: "10px", color: "#64748b", display: "flex", flexDirection: "column", gap: "3px" }}>
                      単位
                      <select value={customDraft.unit} onChange={e => setCustomDraft(d => ({ ...d, unit: e.target.value }))}
                        style={{ ...inputStyle, fontSize: "12px", padding: "7px 10px" }}>
                        {["個","本","粒","g","ml","袋","枚"].map(u => <option key={u} value={u}>{u}</option>)}
                      </select>
                    </label>
                  </div>

                  {/* Nutrition grid */}
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "6px" }}>
                    {[
                      { key: "carbs",  label: "糖質 (g)",  color: "#fbbf24" },
                      { key: "water",  label: "水分 (ml)", color: "#60a5fa" },
                      { key: "sodium", label: "Na (mg)",   color: "#c4b5fd" },
                      { key: "k",      label: "K (mg)",    color: "#4ade80" },
                      { key: "mg",     label: "Mg (mg)",   color: "#f97316" },
                    ].map(({ key, label, color }) => (
                      <label key={key} style={{ fontSize: "10px", color: "#64748b", display: "flex", flexDirection: "column", gap: "3px" }}>
                        {label}
                        <input type="number" min="0" value={customDraft[key]}
                          onChange={e => setCustomDraft(d => ({ ...d, [key]: +e.target.value || 0 }))}
                          style={{ width: "100%", padding: "5px 6px", borderRadius: "6px", border: `1px solid ${color}33`, background: `${color}11`, color, fontSize: "12px", fontWeight: "700", outline: "none", boxSizing: "border-box" }}
                        />
                      </label>
                    ))}
                  </div>

                  <div style={{ display: "flex", gap: "6px" }}>
                    <button onClick={() => { setShowCustomForm(false); setCustomDraft({ name: "", carbs: 0, water: 0, sodium: 0, k: 0, mg: 0, qty: 1, unit: "個" }); }}
                      style={{ flex: 1, padding: "8px", borderRadius: "8px", border: "none", background: "rgba(148,163,184,0.1)", color: "#64748b", cursor: "pointer", fontSize: "12px" }}>
                      キャンセル
                    </button>
                    <button onClick={() => addCustomItem(openSeg)} disabled={!customDraft.name.trim()}
                      style={{ flex: 2, padding: "8px", borderRadius: "8px", border: "none", background: customDraft.name.trim() ? "rgba(245,158,11,0.2)" : "rgba(30,41,59,0.3)", color: customDraft.name.trim() ? "#f59e0b" : "#334155", cursor: customDraft.name.trim() ? "pointer" : "default", fontSize: "12px", fontWeight: "700" }}>
                      追加する
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* Summary totals */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "8px", marginBottom: "12px" }}>
        {[
          { label: "糖質 total", v: grandTotal.carbs, unit: "g",  sub: `${Math.round(grandTotal.carbs / hours)}g/h` },
          { label: "Na total",   v: grandTotal.na,    unit: "mg", sub: `${Math.round(grandTotal.na / hours)}mg/h` },
          { label: "水分 total", v: grandTotal.water,  unit: "ml", sub: `${Math.round(grandTotal.water / hours)}ml/h` },
        ].map(({ label, v, unit, sub }) => (
          <div key={label} style={{ ...cardBase, textAlign: "center", padding: "12px 6px" }}>
            <div style={{ fontSize: "9px", color: "#64748b", marginBottom: "4px" }}>{label}</div>
            <div style={{ fontSize: "18px", fontWeight: "900", color: "#f1f5f9" }}>{v}<span style={{ fontSize: "10px", marginLeft: "1px" }}>{unit}</span></div>
            <div style={{ fontSize: "9px", color: "#475569", marginTop: "2px" }}>{sub}</div>
          </div>
        ))}
      </div>

      {/* Per-segment breakdown */}
      <div style={{ display: "flex", gap: "6px", overflowX: "auto", marginBottom: "20px", WebkitOverflowScrolling: "touch" }}>
        {segments.map(seg => {
          const t = segTotals(segFuel[seg.idx]);
          const isEmpty = !(segFuel[seg.idx]?.length);
          const isActive = openSeg === seg.idx;
          return (
            <div key={seg.idx} onClick={() => setOpenSeg(isActive ? null : seg.idx)} style={{
              minWidth: "74px", padding: "9px 6px", borderRadius: "10px", textAlign: "center", cursor: "pointer", flexShrink: 0,
              background: isEmpty ? "rgba(239,68,68,0.06)" : isActive ? "rgba(99,102,241,0.15)" : "rgba(30,41,59,0.4)",
              border: `1px solid ${isEmpty ? "rgba(239,68,68,0.18)" : isActive ? "rgba(99,102,241,0.3)" : "rgba(148,163,184,0.06)"}`,
            }}>
              <div style={{ fontSize: "9px", color: "#475569", marginBottom: "3px" }}>{seg.startKm}–{Number.isInteger(seg.endKm) ? seg.endKm : seg.endKm.toFixed(1)}km</div>
              {isEmpty
                ? <div style={{ fontSize: "10px", color: "#ef4444", fontWeight: "700" }}>補給なし</div>
                : <><div style={{ fontSize: "13px", fontWeight: "800", color: "#fbbf24" }}>{t.carbs}g</div><div style={{ fontSize: "9px", color: "#64748b" }}>Na {t.na}mg</div></>
              }
            </div>
          );
        })}
      </div>

      <button onClick={() => onDone(flatten())} style={{
        width: "100%", padding: "16px", borderRadius: "14px", border: "none",
        background: "linear-gradient(135deg, #6366f1, #8b5cf6)",
        color: "#fff", fontSize: "15px", fontWeight: "800", cursor: "pointer",
        boxShadow: "0 8px 24px rgba(99,102,241,0.3)",
      }}>この補給内容を分析する →</button>
    </div>
  );
}

const db = {
  users() { return JSON.parse(localStorage.getItem("fl_users") || "{}"); },
  save(u, k, v) { localStorage.setItem(`fl_${u}_${k}`, JSON.stringify(v)); },
  load(u, k, d = null) {
    try { const r = localStorage.getItem(`fl_${u}_${k}`); return r ? JSON.parse(r) : d; }
    catch { return d; }
  },
};

function AuthScreen({ onAuth }) {
  const [mode, setMode] = useState("login");
  const [username, setUsername] = useState("");
  const [displayName, setDisplayName] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");

  const bg   = "linear-gradient(165deg, #0a0e17 0%, #111827 40%, #1a1a2e 100%)";
  const font = "'Noto Sans JP', 'SF Pro Display', -apple-system, sans-serif";

  function handleSignup() {
    if (!username.trim() || !displayName.trim() || password.length < 4) {
      setError("ユーザー名・表示名・パスワード（4文字以上）を入力してください"); return;
    }
    const users = db.users();
    if (users[username]) { setError("このユーザー名は既に使われています"); return; }
    users[username] = { username, displayName, password };
    localStorage.setItem("fl_users", JSON.stringify(users));
    localStorage.setItem("fl_currentUser", username);
    onAuth({ username, displayName });
  }

  function handleLogin() {
    const users = db.users();
    const u = users[username];
    if (!u || u.password !== password) { setError("ユーザー名またはパスワードが違います"); return; }
    localStorage.setItem("fl_currentUser", username);
    onAuth({ username, displayName: u.displayName });
  }

  return (
    <div style={{ minHeight: "100vh", background: bg, fontFamily: font, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "20px" }}>
      <div style={{ width: "100%", maxWidth: "380px" }}>
        <div style={{ textAlign: "center", marginBottom: "32px" }}>
          <div style={{ fontSize: "40px", marginBottom: "8px" }}>⚡</div>
          <div style={{ fontSize: "24px", fontWeight: "900", letterSpacing: "-1px", color: "#f8fafc" }}>FUEL LAB</div>
          <div style={{ fontSize: "12px", color: "#475569", marginTop: "4px" }}>Trail Running Nutrition Planner</div>
        </div>
        <div style={{ display: "flex", background: "rgba(15,23,42,0.6)", borderRadius: "12px", padding: "4px", marginBottom: "20px" }}>
          {[["login", "ログイン"], ["signup", "新規登録"]].map(([m, label]) => (
            <button key={m} onClick={() => { setMode(m); setError(""); }} style={{
              flex: 1, padding: "10px", borderRadius: "9px", border: "none", cursor: "pointer",
              background: m === mode ? "rgba(99,102,241,0.25)" : "transparent",
              color: m === mode ? "#a5b4fc" : "#475569", fontSize: "13px", fontWeight: "700",
            }}>{label}</button>
          ))}
        </div>
        <div style={{ ...cardBase, padding: "20px" }}>
          <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
            <label style={{ fontSize: "11px", color: "#64748b", display: "flex", flexDirection: "column", gap: "5px" }}>
              ユーザー名
              <input value={username} onChange={e => setUsername(e.target.value.trim())} placeholder="nooobu" style={inputStyle} />
            </label>
            {mode === "signup" && (
              <label style={{ fontSize: "11px", color: "#64748b", display: "flex", flexDirection: "column", gap: "5px" }}>
                表示名
                <input value={displayName} onChange={e => setDisplayName(e.target.value)} placeholder="のぶ" style={inputStyle} />
              </label>
            )}
            <label style={{ fontSize: "11px", color: "#64748b", display: "flex", flexDirection: "column", gap: "5px" }}>
              パスワード
              <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" style={inputStyle} />
            </label>
          </div>
          {error && <div style={{ marginTop: "12px", padding: "10px 14px", borderRadius: "10px", background: "rgba(239,68,68,0.08)", border: "1px solid rgba(239,68,68,0.2)", fontSize: "12px", color: "#f87171" }}>{error}</div>}
          <button onClick={mode === "signup" ? handleSignup : handleLogin} style={{
            marginTop: "16px", width: "100%", padding: "14px", borderRadius: "12px", border: "none",
            background: "linear-gradient(135deg, #6366f1, #8b5cf6)",
            color: "#fff", fontSize: "14px", fontWeight: "800", cursor: "pointer",
            boxShadow: "0 8px 24px rgba(99,102,241,0.35)",
          }}>{mode === "signup" ? "アカウントを作成する →" : "ログイン →"}</button>
        </div>
      </div>
    </div>
  );
}

// ─── App Root ───────────────────────────────────────────────────────────────
function AppRoot() {
  const [user, setUser] = useState(() => {
    const u = localStorage.getItem("fl_currentUser");
    if (!u) return null;
    const users = db.users();
    return users[u] ? { username: u, displayName: users[u].displayName } : null;
  });
  if (!user) return <AuthScreen onAuth={setUser} />;
  return <FuelLabOnboarding user={user} onLogout={() => { localStorage.removeItem("fl_currentUser"); setUser(null); }} />;
}

// ─── Main App ──────────────────────────────────────────────────────────────
function FuelLabOnboarding({ user, onLogout }) {
  const [step, setStep] = useState(0);
  const [runType, setRunType] = useState(db.load(user.username, "runType") || null);       // 'road' | 'trail' | 'both'
  const [profile, setProfile] = useState(db.load(user.username, "profile") || { name: user.displayName, age: 30, height: 170, weight: 65 });
  const [runData, setRunData] = useState(null);
  const [manualMode, setManualMode] = useState(false);
  const [manualRun, setManualRun] = useState({ title: "", dist: 0, hours: 0, mins: 0, ascent: 0, avgHR: 0 });
  const [isParsingCSV, setIsParsingCSV] = useState(false);
  const [csvError, setCSVError] = useState(null);
  const [nutritionItems, setNutritionItems] = useState([]);
  const [feeling, setFeeling] = useState(3);
  const [symptoms, setSymptoms] = useState([]);
  const [analysis, setAnalysis] = useState(null);
  const [onboardingDone, setOnboardingDone] = useState(!!db.load(user.username, "profile"));
  const csvInputRef = useRef(null);

  const TOTAL_STEPS = 6; // 1 welcome + 5 content steps

  function handleCSV(file) {
    if (!file) return;
    setIsParsingCSV(true);
    setCSVError(null);
    const reader = new FileReader();
    reader.onload = e => {
      const result = parseActivityCSV(e.target.result);
      if (result) { setRunData(result); setCSVError(null); }
      else setCSVError("CSVを読み取れませんでした。Garmin Activities CSVか手動入力をお試しください。");
      setIsParsingCSV(false);
    };
    reader.readAsText(file, "UTF-8");
  }

  function toggleNutrition(id) {
    setNutritionItems(prev => {
      const p = NUTRITION_PRESETS.find(x => x.id === id);
      if (prev.find(i => i.id === id)) return prev.filter(i => i.id !== id);
      return [...prev, { id, qty: p.defaultQty, carbs: p.carbs, sodium: p.sodium, water: p.water, k: p.k ?? 0, mg: p.mg ?? 0 }];
    });
  }

  function updateQty(id, qty) {
    setNutritionItems(prev => prev.map(i => i.id === id ? { ...i, qty } : i));
  }

  function updateItemNutrition(id, field, raw) {
    const val = parseInt(raw, 10);
    if (isNaN(val) || val < 0) return;
    setNutritionItems(prev => prev.map(i => i.id === id ? { ...i, [field]: val } : i));
  }

  function toggleSymptom(id) {
    setSymptoms(prev => {
      if (id === "none") return [{ id: "none", km: 0 }];
      const filtered = prev.filter(s => s.id !== "none");
      if (filtered.find(s => s.id === id)) return filtered.filter(s => s.id !== id);
      return [...filtered, { id, km: 0 }];
    });
  }

  function updateSymptomKm(id, km) {
    setSymptoms(prev => prev.map(s => s.id === id ? { ...s, km } : s));
  }

  function effectiveRunData() {
    if (runData) return runData;
    if (manualMode) {
      const durationMins = manualRun.hours * 60 + manualRun.mins;
      if (!manualRun.dist || !durationMins) return null;
      return { title: manualRun.title || "トレーニングラン", date: "", dist: manualRun.dist, durationMins, ascent: manualRun.ascent, avgHR: manualRun.avgHR, maxHR: 0, calories: 0 };
    }
    return null;
  }

  function handleToAnalysis() {
    const rd = effectiveRunData();
    if (rd) setAnalysis(computeAnalysis(rd, nutritionItems, symptoms, runType));
    setStep(6);
  }

  // Step guards
  const canProceed = [
    true,                                          // 0 welcome
    runType !== null,                              // 1 run type
    profile.name.trim().length > 0,               // 2 profile
    effectiveRunData() !== null,                   // 3 import
    true,                                          // 4 nutrition (optional)
    true,                                          // 5 symptoms (optional)
  ];

  if (onboardingDone) return <MainAppShell user={user} profile={profile} runType={runType} analysis={analysis} runData={effectiveRunData()} onLogout={onLogout} />;

  return (
    <div style={{
      minHeight: "100vh",
      background: "linear-gradient(165deg, #0a0e17 0%, #111827 40%, #1a1a2e 100%)",
      color: "#e2e8f0",
      fontFamily: "'Noto Sans JP', 'SF Pro Display', -apple-system, sans-serif",
      position: "relative", overflow: "hidden",
    }}>
      {/* Ambient glow */}
      <div style={{ position: "fixed", top: "-20%", right: "-10%", width: "50vw", height: "50vw", background: "radial-gradient(circle, rgba(99,102,241,0.08) 0%, transparent 70%)", pointerEvents: "none" }}/>
      <div style={{ position: "fixed", bottom: "-20%", left: "-10%", width: "40vw", height: "40vw", background: "radial-gradient(circle, rgba(34,197,94,0.06) 0%, transparent 70%)", pointerEvents: "none" }}/>

      <div style={{ maxWidth: "480px", margin: "0 auto", padding: "0 0 80px", position: "relative", zIndex: 1 }}>

        {/* ── Header ── */}
        {step > 0 && (
          <div style={{ padding: "20px 20px 0", display: "flex", alignItems: "center", gap: "12px" }}>
            <button onClick={() => setStep(s => Math.max(0, s - 1))} style={{
              width: "32px", height: "32px", borderRadius: "8px", border: "none",
              background: "rgba(30,41,59,0.6)", color: "#94a3b8", cursor: "pointer", fontSize: "16px",
              display: "flex", alignItems: "center", justifyContent: "center",
            }}>←</button>
            <div style={{ flex: 1, height: "4px", background: "rgba(30,41,59,0.8)", borderRadius: "2px", overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${(step / TOTAL_STEPS) * 100}%`, background: "linear-gradient(90deg, #22c55e, #6366f1)", borderRadius: "2px", transition: "width 0.4s ease" }}/>
            </div>
            <span style={{ fontSize: "11px", color: "#64748b", fontWeight: "600", minWidth: "32px", textAlign: "right" }}>{step}/{TOTAL_STEPS}</span>
          </div>
        )}

        {/* ── Step 0: Welcome ── */}
        {step === 0 && (
          <div style={{ padding: "60px 24px 24px", textAlign: "center" }}>
            <div style={{
              width: "72px", height: "72px", borderRadius: "20px", margin: "0 auto 20px",
              background: "linear-gradient(135deg, #22c55e, #059669)",
              display: "flex", alignItems: "center", justifyContent: "center",
              fontSize: "36px", boxShadow: "0 8px 32px rgba(34,197,94,0.35)",
            }}>⚡</div>
            <div style={{ fontSize: "28px", fontWeight: "900", letterSpacing: "-1px", color: "#f8fafc", marginBottom: "8px" }}>FUEL LAB</div>
            <div style={{ fontSize: "13px", color: "#64748b", letterSpacing: "2px", textTransform: "uppercase", marginBottom: "32px" }}>Trail & Road Nutrition Planner</div>
            <p style={{ fontSize: "14px", color: "#94a3b8", lineHeight: 1.8, marginBottom: "40px", padding: "0 8px" }}>
              あなたの走りに合わせた補給プランを作成します。<br/>
              直近のランのデータをもとに、<strong style={{ color: "#e2e8f0" }}>何が足りていたか・いなかったか</strong>を分析し、<br/>
              パーソナライズされたプランを提案します。
            </p>
            <div style={{ display: "flex", flexDirection: "column", gap: "10px", padding: "0 12px" }}>
              {[
                { icon: "🏃", text: "ランタイプとプロフィール登録" },
                { icon: "📊", text: "過去のランデータをインポート" },
                { icon: "🔬", text: "補給と体調を分析・診断" },
                { icon: "📋", text: "あなた専用プランを作成" },
              ].map((item, i) => (
                <div key={i} style={{ display: "flex", alignItems: "center", gap: "12px", padding: "10px 14px", borderRadius: "12px", background: "rgba(30,41,59,0.4)", border: "1px solid rgba(148,163,184,0.06)" }}>
                  <span style={{ fontSize: "20px" }}>{item.icon}</span>
                  <span style={{ fontSize: "13px", color: "#94a3b8" }}>{item.text}</span>
                </div>
              ))}
            </div>
            <button onClick={() => setStep(1)} style={{
              marginTop: "36px", width: "100%", padding: "16px", borderRadius: "14px", border: "none",
              background: "linear-gradient(135deg, #22c55e, #059669)",
              color: "#fff", fontSize: "15px", fontWeight: "800", cursor: "pointer",
              boxShadow: "0 8px 24px rgba(34,197,94,0.35)",
            }}>はじめる →</button>
            <p style={{ fontSize: "10px", color: "#334155", marginTop: "16px" }}>約3〜5分で完了します</p>
          </div>
        )}

        {/* ── Step 1: Run Type ── */}
        {step === 1 && (
          <div style={{ padding: "28px 20px" }}>
            <div style={{ fontSize: "11px", fontWeight: "700", color: "#64748b", letterSpacing: "2px", textTransform: "uppercase", marginBottom: "8px" }}>STEP 1</div>
            <div style={{ fontSize: "22px", fontWeight: "800", color: "#f1f5f9", marginBottom: "6px" }}>メインのランタイプは？</div>
            <p style={{ fontSize: "13px", color: "#64748b", marginBottom: "28px", lineHeight: 1.6 }}>補給の推奨量・内容はランタイプによって大きく異なります。</p>

            <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
              {[
                { id: "trail", icon: "🏔️", title: "トレイルラン", sub: "山岳・未舗装路メイン / 電解質・固形物重視" },
                { id: "road",  icon: "🏙️", title: "ロードラン",   sub: "舗装路・レース・ファンラン / ジェル・ドリンク中心" },
                { id: "both",  icon: "🔄", title: "両方やります", sub: "シーズンによって使い分け" },
              ].map(opt => (
                <div key={opt.id} onClick={() => setRunType(opt.id)} style={{
                  ...cardBase,
                  cursor: "pointer", padding: "20px",
                  border: `1px solid ${runType === opt.id ? "rgba(34,197,94,0.6)" : "rgba(148,163,184,0.1)"}`,
                  background: runType === opt.id ? "rgba(34,197,94,0.08)" : "rgba(30,41,59,0.6)",
                  transition: "all 0.2s",
                  display: "flex", alignItems: "center", gap: "16px",
                }}>
                  <div style={{ fontSize: "36px", lineHeight: 1 }}>{opt.icon}</div>
                  <div>
                    <div style={{ fontSize: "15px", fontWeight: "700", color: runType === opt.id ? "#4ade80" : "#f1f5f9" }}>{opt.title}</div>
                    <div style={{ fontSize: "12px", color: "#64748b", marginTop: "3px" }}>{opt.sub}</div>
                  </div>
                  {runType === opt.id && <div style={{ marginLeft: "auto", width: "20px", height: "20px", borderRadius: "50%", background: "#22c55e", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "11px" }}>✓</div>}
                </div>
              ))}
            </div>

            <NextButton disabled={!canProceed[1]} onClick={() => setStep(2)} />
          </div>
        )}

        {/* ── Step 2: Profile ── */}
        {step === 2 && (
          <div style={{ padding: "28px 20px" }}>
            <div style={{ fontSize: "11px", fontWeight: "700", color: "#64748b", letterSpacing: "2px", textTransform: "uppercase", marginBottom: "8px" }}>STEP 2</div>
            <div style={{ fontSize: "22px", fontWeight: "800", color: "#f1f5f9", marginBottom: "6px" }}>ランナープロフィール</div>
            <p style={{ fontSize: "13px", color: "#64748b", marginBottom: "28px", lineHeight: 1.6 }}>体重・身長は発汗量・消費カロリーの計算に使用します。</p>

            <div style={{ display: "flex", flexDirection: "column", gap: "14px" }}>
              <label style={{ fontSize: "11px", color: "#64748b", display: "flex", flexDirection: "column", gap: "6px" }}>
                ニックネーム / 名前
                <input value={profile.name} onChange={e => setProfile(p => ({...p, name: e.target.value}))}
                  placeholder="田中 走" style={inputStyle} />
              </label>

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "10px" }}>
                <label style={{ fontSize: "11px", color: "#64748b", display: "flex", flexDirection: "column", gap: "6px" }}>
                  年齢
                  <input type="number" value={profile.age} onChange={e => setProfile(p => ({...p, age: +e.target.value}))}
                    style={inputStyle} min={10} max={100} />
                </label>
                <label style={{ fontSize: "11px", color: "#64748b", display: "flex", flexDirection: "column", gap: "6px" }}>
                  身長 (cm)
                  <input type="number" value={profile.height} onChange={e => setProfile(p => ({...p, height: +e.target.value}))}
                    style={inputStyle} min={100} max={220} />
                </label>
              </div>

              <label style={{ fontSize: "11px", color: "#64748b", display: "flex", flexDirection: "column", gap: "6px" }}>
                体重 (kg)
                <div style={{ position: "relative" }}>
                  <input type="range" min={35} max={120} value={profile.weight}
                    onChange={e => setProfile(p => ({...p, weight: +e.target.value}))}
                    style={{ width: "100%", accentColor: "#22c55e", cursor: "pointer" }} />
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: "4px" }}>
                    <span style={{ fontSize: "10px", color: "#475569" }}>35kg</span>
                    <span style={{ fontSize: "22px", fontWeight: "800", color: "#4ade80" }}>{profile.weight}<span style={{ fontSize: "13px", fontWeight: "500", color: "#64748b" }}>kg</span></span>
                    <span style={{ fontSize: "10px", color: "#475569" }}>120kg</span>
                  </div>
                </div>
              </label>

              <div style={{ padding: "12px 14px", borderRadius: "12px", background: "rgba(99,102,241,0.08)", border: "1px solid rgba(99,102,241,0.15)", marginTop: "4px" }}>
                <div style={{ fontSize: "10px", color: "#64748b", marginBottom: "4px" }}>フルマラソンの推定消費カロリー</div>
                <div style={{ fontSize: "20px", fontWeight: "800", color: "#c7d2fe" }}>
                  {Math.round(profile.weight * 42.195 * 1.04).toLocaleString()} kcal
                </div>
                <div style={{ fontSize: "10px", color: "#475569", marginTop: "2px" }}>体重 × 距離 × 1.04係数</div>
              </div>
            </div>

            <NextButton disabled={!canProceed[2]} onClick={() => setStep(3)} />
          </div>
        )}

        {/* ── Step 3: Import run data ── */}
        {step === 3 && (
          <div style={{ padding: "28px 20px" }}>
            <div style={{ fontSize: "11px", fontWeight: "700", color: "#64748b", letterSpacing: "2px", textTransform: "uppercase", marginBottom: "8px" }}>STEP 3</div>
            <div style={{ fontSize: "22px", fontWeight: "800", color: "#f1f5f9", marginBottom: "6px" }}>直近のランデータ</div>
            <p style={{ fontSize: "13px", color: "#64748b", marginBottom: "24px", lineHeight: 1.6 }}>
              長めのラン（1時間以上）のデータが理想です。<br/>
              GarminのActivities CSVをそのままアップロードできます。
            </p>

            {/* Mode toggle */}
            <div style={{ display: "flex", gap: "8px", marginBottom: "20px" }}>
              {[{ id: false, label: "📁 CSVインポート" }, { id: true, label: "✏️ 手動入力" }].map(m => (
                <button key={String(m.id)} onClick={() => { setManualMode(m.id); setRunData(null); setCSVError(null); }} style={{
                  flex: 1, padding: "8px", borderRadius: "10px", border: "none", cursor: "pointer",
                  background: manualMode === m.id ? "rgba(99,102,241,0.2)" : "rgba(30,41,59,0.5)",
                  color: manualMode === m.id ? "#a5b4fc" : "#64748b",
                  fontSize: "12px", fontWeight: "600",
                  border: `1px solid ${manualMode === m.id ? "rgba(99,102,241,0.3)" : "rgba(148,163,184,0.08)"}`,
                }}>{m.label}</button>
              ))}
            </div>

            {!manualMode ? (
              <>
                {!runData ? (
                  <div
                    onClick={() => csvInputRef.current && csvInputRef.current.click()}
                    onDragOver={e => e.preventDefault()}
                    onDrop={e => { e.preventDefault(); handleCSV(e.dataTransfer.files[0]); }}
                    style={{
                      border: "2px dashed rgba(148,163,184,0.2)", borderRadius: "16px",
                      padding: "40px 20px", textAlign: "center", cursor: "pointer",
                      background: "rgba(30,41,59,0.3)", transition: "all 0.2s",
                    }}
                  >
                    <div style={{ fontSize: "40px", marginBottom: "10px" }}>📊</div>
                    <div style={{ fontSize: "14px", fontWeight: "700", color: "#f1f5f9", marginBottom: "4px" }}>CSVをドロップ</div>
                    <div style={{ fontSize: "12px", color: "#64748b", marginBottom: "12px" }}>またはクリックして選択</div>
                    <div style={{ fontSize: "10px", color: "#475569", lineHeight: 1.6 }}>
                      Garmin Connect → アクティビティ → エクスポート → CSV<br/>
                      Strava の Activities.csv にも対応
                    </div>
                    <input ref={csvInputRef} type="file" accept=".csv" style={{ display: "none" }}
                      onChange={e => handleCSV(e.target.files[0])} />
                  </div>
                ) : (
                  <RunDataCard data={runData} onClear={() => setRunData(null)} />
                )}
                {isParsingCSV && <div style={{ textAlign: "center", marginTop: "12px", color: "#22c55e", fontSize: "13px" }}>📡 読み込み中...</div>}
                {csvError && <div style={{ marginTop: "10px", padding: "10px 14px", borderRadius: "10px", background: "rgba(239,68,68,0.08)", border: "1px solid rgba(239,68,68,0.2)", fontSize: "12px", color: "#f87171" }}>{csvError}</div>}
              </>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
                <label style={{ fontSize: "11px", color: "#64748b", display: "flex", flexDirection: "column", gap: "5px" }}>
                  アクティビティ名
                  <input value={manualRun.title} onChange={e => setManualRun(r => ({...r, title: e.target.value}))}
                    placeholder="丹沢ロング" style={inputStyle} />
                </label>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "10px" }}>
                  <label style={{ fontSize: "11px", color: "#64748b", display: "flex", flexDirection: "column", gap: "5px" }}>
                    距離 (km)
                    <input type="number" value={manualRun.dist || ""} onChange={e => setManualRun(r => ({...r, dist: +e.target.value}))}
                      placeholder="29.8" style={inputStyle} step="0.1" min={0} />
                  </label>
                  <label style={{ fontSize: "11px", color: "#64748b", display: "flex", flexDirection: "column", gap: "5px" }}>
                    累積標高 (m)
                    <input type="number" value={manualRun.ascent || ""} onChange={e => setManualRun(r => ({...r, ascent: +e.target.value}))}
                      placeholder="1577" style={inputStyle} min={0} />
                  </label>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "10px" }}>
                  <label style={{ fontSize: "11px", color: "#64748b", display: "flex", flexDirection: "column", gap: "5px" }}>
                    タイム（時間）
                    <input type="number" value={manualRun.hours || ""} onChange={e => setManualRun(r => ({...r, hours: +e.target.value}))}
                      placeholder="5" style={inputStyle} min={0} max={24} />
                  </label>
                  <label style={{ fontSize: "11px", color: "#64748b", display: "flex", flexDirection: "column", gap: "5px" }}>
                    タイム（分）
                    <input type="number" value={manualRun.mins || ""} onChange={e => setManualRun(r => ({...r, mins: +e.target.value}))}
                      placeholder="15" style={inputStyle} min={0} max={59} />
                  </label>
                </div>
                <label style={{ fontSize: "11px", color: "#64748b", display: "flex", flexDirection: "column", gap: "5px" }}>
                  平均心拍数 (bpm)（任意）
                  <input type="number" value={manualRun.avgHR || ""} onChange={e => setManualRun(r => ({...r, avgHR: +e.target.value}))}
                    placeholder="155" style={inputStyle} min={0} max={220} />
                </label>
                {manualRun.dist > 0 && (manualRun.hours > 0 || manualRun.mins > 0) && (
                  <RunDataCard data={{ title: manualRun.title || "トレーニングラン", date: "", dist: manualRun.dist, durationMins: manualRun.hours * 60 + manualRun.mins, ascent: manualRun.ascent, avgHR: manualRun.avgHR }} />
                )}
              </div>
            )}

            <NextButton disabled={!canProceed[3]} onClick={() => setStep(4)} label="次へ（補給記録）" />
          </div>
        )}

        {/* ── Step 4: Nutrition Timeline ── */}
        {step === 4 && (
          <NutritionTimelineStep
            runData={effectiveRunData()}
            onDone={items => { setNutritionItems(items); setStep(5); }}
          />
        )}

        {/* ── Step 5: Symptoms ── */}
        {step === 5 && (
          <div style={{ padding: "28px 20px" }}>
            <div style={{ fontSize: "11px", fontWeight: "700", color: "#64748b", letterSpacing: "2px", textTransform: "uppercase", marginBottom: "8px" }}>STEP 5</div>
            <div style={{ fontSize: "22px", fontWeight: "800", color: "#f1f5f9", marginBottom: "6px" }}>そのランの体調は？</div>
            <p style={{ fontSize: "13px", color: "#64748b", marginBottom: "24px", lineHeight: 1.6 }}>気になった症状があれば選んでください。何キロ地点かも教えてください。</p>

            {/* Feeling score */}
            <div style={{ ...cardBase, marginBottom: "20px", padding: "16px 20px" }}>
              <div style={{ fontSize: "11px", color: "#64748b", marginBottom: "10px" }}>全体的な体調</div>
              <div style={{ display: "flex", gap: "8px", justifyContent: "center" }}>
                {[
                  { val: 1, icon: "😫", label: "ひどかった" },
                  { val: 2, icon: "😕", label: "きつかった" },
                  { val: 3, icon: "😐", label: "普通" },
                  { val: 4, icon: "😊", label: "良かった" },
                  { val: 5, icon: "🤩", label: "最高！" },
                ].map(f => (
                  <button key={f.val} onClick={() => setFeeling(f.val)} style={{
                    flex: 1, padding: "10px 4px", borderRadius: "10px", border: "none", cursor: "pointer",
                    background: feeling === f.val ? "rgba(34,197,94,0.15)" : "rgba(30,41,59,0.4)",
                    border: `1px solid ${feeling === f.val ? "rgba(34,197,94,0.4)" : "rgba(148,163,184,0.06)"}`,
                    display: "flex", flexDirection: "column", alignItems: "center", gap: "4px",
                  }}>
                    <span style={{ fontSize: "22px" }}>{f.icon}</span>
                    <span style={{ fontSize: "9px", color: feeling === f.val ? "#4ade80" : "#475569" }}>{f.label}</span>
                  </button>
                ))}
              </div>
            </div>

            {/* Symptom list */}
            <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
              {SYMPTOM_OPTIONS.map(opt => {
                const selected = symptoms.find(s => s.id === opt.id);
                return (
                  <div key={opt.id}>
                    <div onClick={() => toggleSymptom(opt.id)} style={{
                      display: "flex", alignItems: "center", gap: "12px",
                      padding: "12px 14px", borderRadius: "12px", cursor: "pointer",
                      background: selected ? (opt.id === "none" ? "rgba(34,197,94,0.08)" : "rgba(239,68,68,0.08)") : "rgba(30,41,59,0.4)",
                      border: `1px solid ${selected ? (opt.id === "none" ? "rgba(34,197,94,0.3)" : "rgba(239,68,68,0.2)") : "rgba(148,163,184,0.06)"}`,
                      transition: "all 0.15s",
                    }}>
                      <span style={{ fontSize: "22px" }}>{opt.icon}</span>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: "13px", fontWeight: "600", color: "#e2e8f0" }}>{opt.label}</div>
                        {opt.cause && <div style={{ fontSize: "10px", color: "#64748b" }}>考えられる原因: {opt.cause}</div>}
                      </div>
                      <div style={{
                        width: "20px", height: "20px", borderRadius: "6px", border: "2px solid",
                        borderColor: selected ? (opt.id === "none" ? "#22c55e" : "#ef4444") : "rgba(148,163,184,0.2)",
                        background: selected ? (opt.id === "none" ? "#22c55e" : "#ef4444") : "transparent",
                        display: "flex", alignItems: "center", justifyContent: "center", fontSize: "10px",
                      }}>{selected ? "✓" : ""}</div>
                    </div>
                    {/* km input for non-none symptoms */}
                    {selected && opt.id !== "none" && (
                      <div style={{ paddingLeft: "48px", paddingTop: "6px" }} onClick={e => e.stopPropagation()}>
                        <label style={{ fontSize: "10px", color: "#64748b", display: "flex", alignItems: "center", gap: "8px" }}>
                          何km地点で？
                          <input type="number" value={selected.km || ""} onChange={e => updateSymptomKm(opt.id, +e.target.value)}
                            placeholder="10" min={0} style={{ ...inputStyle, width: "80px", padding: "6px 10px", fontSize: "13px" }} />
                          <span style={{ fontSize: "11px", color: "#64748b" }}>km</span>
                        </label>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            <button onClick={handleToAnalysis} style={{
              marginTop: "28px", width: "100%", padding: "16px", borderRadius: "14px", border: "none",
              background: "linear-gradient(135deg, #22c55e, #059669)",
              color: "#fff", fontSize: "15px", fontWeight: "800", cursor: "pointer",
              boxShadow: "0 8px 24px rgba(34,197,94,0.3)",
            }}>分析・診断する 🔬</button>
          </div>
        )}

        {/* ── Step 6: Analysis ── */}
        {step === 6 && analysis && (
          <AnalysisStep
            analysis={analysis}
            profile={profile}
            runType={runType}
            runData={effectiveRunData()}
            symptoms={symptoms}
            feeling={feeling}
            onDone={() => { db.save(user.username, "profile", profile); db.save(user.username, "runType", runType); setOnboardingDone(true); }}
          />
        )}

      </div>
    </div>
  );
}

function NutritionTotals({ items }) {
  let carbs = 0, water = 0, sodium = 0;
  items.forEach(item => {
    const p = NUTRITION_PRESETS.find(x => x.id === item.id);
    const mult = p ? (p.unit === "ml" ? item.qty / p.defaultQty : item.qty) : item.qty;
    carbs  += (item.carbs  != null ? item.carbs  : (p?.carbs  ?? 0)) * mult;
    water  += (item.water  != null ? item.water  : (p?.water  ?? 0)) * mult;
    sodium += (item.sodium != null ? item.sodium : (p?.sodium ?? 0)) * mult;
  });
  return (
    <div style={{ padding: "12px 14px", borderRadius: "12px", background: "rgba(30,41,59,0.5)", border: "1px solid rgba(148,163,184,0.08)", marginBottom: "4px" }}>
      <div style={{ fontSize: "10px", color: "#64748b", marginBottom: "8px" }}>合計摂取量（このランの合計）</div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "8px", textAlign: "center" }}>
        <div><div style={{ fontSize: "16px", fontWeight: "800", color: "#fbbf24" }}>{Math.round(carbs)}g</div><div style={{ fontSize: "9px", color: "#64748b" }}>糖質</div></div>
        <div><div style={{ fontSize: "16px", fontWeight: "800", color: "#60a5fa" }}>{Math.round(water)}ml</div><div style={{ fontSize: "9px", color: "#64748b" }}>水分</div></div>
        <div><div style={{ fontSize: "16px", fontWeight: "800", color: "#c4b5fd" }}>{Math.round(sodium)}mg</div><div style={{ fontSize: "9px", color: "#64748b" }}>Na</div></div>
      </div>
    </div>
  );
}

function ScoreRing({ score, color, label }) {
  const r = 28, circ = 2 * Math.PI * r;
  const dash = (score / 100) * circ;
  return (
    <div style={{ textAlign: "center" }}>
      <svg width="72" height="72" viewBox="0 0 72 72">
        <circle cx="36" cy="36" r={r} fill="none" stroke="rgba(148,163,184,0.1)" strokeWidth="6"/>
        <circle cx="36" cy="36" r={r} fill="none" stroke={color} strokeWidth="6"
          strokeDasharray={`${dash} ${circ}`} strokeLinecap="round"
          transform="rotate(-90 36 36)" style={{ transition: "stroke-dasharray 1s ease" }}/>
        <text x="36" y="40" textAnchor="middle" fill={color} fontSize="14" fontWeight="800">{score}</text>
      </svg>
      <div style={{ fontSize: "10px", color: "#64748b", marginTop: "2px" }}>{label}</div>
    </div>
  );
}

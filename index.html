          </div>
          <div style={{ fontSize: "11px", color: "#475569" }}>プロフィールダッシュボード</div>
        </div>
        <button onClick={onLogout} style={{ background: "rgba(30,41,59,0.5)", border: "1px solid rgba(148,163,184,0.1)", color: "#475569", borderRadius: "10px", padding: "8px 12px", cursor: "pointer", fontSize: "11px", fontWeight: "700" }}>ログアウト</button>
      </div>

      <div style={{ padding: "16px 20px 80px" }}>

        {/* Profile card */}
        <div style={{ ...card, display: "flex", alignItems: "center", gap: "14px", padding: "18px 16px" }}>
          <div style={{
            width: "44px", height: "44px", borderRadius: "14px", flexShrink: 0,
            background: "linear-gradient(135deg, #6366f1, #8b5cf6)",
            display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: "20px", fontWeight: "900", color: "#fff",
          }}>
            {(profile.name || "?")[0]}
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: "15px", fontWeight: "800", color: "#f1f5f9" }}>{profile.name}</div>
            <div style={{ fontSize: "11px", color: "#64748b", marginTop: "2px" }}>{runTypeLabel}</div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: "10px", color: "#64748b", marginBottom: "2px" }}>最新スコア</div>
            <div style={{
              fontSize: "24px", fontWeight: "900",
              color: latestScore >= 80 ? "#4ade80" : latestScore >= 55 ? "#fbbf24" : "#f87171",
            }}>{latestScore}</div>
          </div>
        </div>

        {/* Summary stats */}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "8px", marginBottom: "20px" }}>
          {[
            { label: "トレーニング", value: activities.length, unit: "回" },
            { label: "総距離", value: `${Math.round(totalDist * 10) / 10}`, unit: "km" },
            { label: "総時間", value: fmt(totalMins), unit: "" },
          ].map(({ label, value, unit }) => (
            <div key={label} style={{ ...cardBase, textAlign: "center", padding: "12px 8px" }}>
              <div style={{ fontSize: "10px", color: "#64748b", marginBottom: "4px" }}>{label}</div>
              <div style={{ fontSize: unit ? "18px" : "13px", fontWeight: "900", color: "#f1f5f9" }}>{value}</div>
              {unit && <div style={{ fontSize: "9px", color: "#475569" }}>{unit}</div>}
            </div>
          ))}
        </div>

        {/* Period toggle + log header */}
        <div style={{ display: "flex", alignItems: "center", marginBottom: "12px" }}>
          <div style={{ fontSize: "11px", fontWeight: "700", color: "#64748b", letterSpacing: "2px", textTransform: "uppercase", flex: 1 }}>
            TRAINING LOG <span style={{ color: "#334155", fontWeight: "400" }}>({periodActivities.length}件)</span>
          </div>
          <div style={{ display: "flex", background: "rgba(15,23,42,0.6)", borderRadius: "8px", padding: "3px" }}>
            {[["weekly", "Weekly"], ["monthly", "Monthly"]].map(([key, label]) => (
              <button key={key} onClick={() => setPeriod(key)} style={{
                padding: "4px 10px", borderRadius: "6px", border: "none",
                background: key === period ? "rgba(99,102,241,0.25)" : "transparent",
                color: key === period ? "#a5b4fc" : "#475569",
                fontSize: "10px", fontWeight: "700", cursor: "pointer",
              }}>{label}</button>
            ))}
          </div>
        </div>

        {/* Activity list */}
        {periodActivities.length === 0 ? (
          <div style={{ ...cardBase, textAlign: "center", padding: "24px", color: "#475569", fontSize: "12px", marginBottom: "12px" }}>
            この期間のトレーニングはありません
          </div>
        ) : (
          periodActivities.map(act => <ActivityCard key={act.id} activity={act} onEdit={() => onEditActivity(act)} />)
        )}

        {/* Add activity */}
        <input ref={fileRef} type="file" accept=".csv" style={{ display: "none" }}
          onChange={e => { if (e.target.files[0]) { onAddActivity(e.target.files[0]); e.target.value = ""; } }} />
        <button onClick={() => fileRef.current.click()} style={{
          width: "100%", padding: "14px", borderRadius: "14px",
          border: "1px dashed rgba(148,163,184,0.2)", background: "rgba(30,41,59,0.3)",
          color: "#64748b", fontSize: "13px", fontWeight: "700", cursor: "pointer", marginBottom: "20px",
        }}>
          + トレーニングログを追加
        </button>

        {/* Saved plans */}
        {savedPlans && savedPlans.length > 0 && (
          <>
            <div style={{ fontSize: "11px", fontWeight: "700", color: "#64748b", letterSpacing: "2px", textTransform: "uppercase", marginBottom: "12px", marginTop: "8px" }}>
              SAVED PLANS
            </div>
            {savedPlans.map(plan => (
              <div key={plan.id} style={{ ...cardBase, marginBottom: "10px", padding: "14px 16px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: "13px", fontWeight: "800", color: "#f1f5f9", marginBottom: "3px" }}>
                      {plan.planName || "プラン"}
                    </div>
                    <div style={{ fontSize: "11px", color: "#64748b" }}>
                      {plan.dist}km · {plan.goalHrs ?? "-"}h{plan.goalMin ?? "-"}m · ↑{plan.ascent}m
                    </div>
                    <div style={{ fontSize: "10px", color: "#475569", marginTop: "2px" }}>
                      糖質 {plan.targetCarbsHr}g/hr · Na {plan.targetSodiumHr}mg/hr
                    </div>
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: "6px" }}>
                    <div style={{ fontSize: "10px", color: "#334155" }}>
                      {new Date(plan.createdAt).toLocaleDateString("ja-JP", { month: "short", day: "numeric" })}
                    </div>
                    <button onClick={() => onViewPlan(plan)} style={{
                      background: "rgba(99,102,241,0.15)", border: "1px solid rgba(99,102,241,0.3)",
                      color: "#a5b4fc", borderRadius: "8px", padding: "4px 12px",
                      fontSize: "11px", fontWeight: "700", cursor: "pointer",
                    }}>開く</button>
                  </div>
                </div>
              </div>
            ))}
          </>
        )}

        {/* Plan CTA */}
        <button onClick={onPlan} style={{
          width: "100%", padding: "16px", borderRadius: "14px", border: "none",
          background: "linear-gradient(135deg, #6366f1, #8b5cf6)",
          color: "#fff", fontSize: "15px", fontWeight: "800", cursor: "pointer",
          boxShadow: "0 8px 24px rgba(99,102,241,0.35)",
        }}>プランを作成する →</button>
      </div>
    </div>
  );
}

// ─── Main App Shell (navigation shell) ──────────────────────────────────────
function MainAppShell({ user, profile, runType, analysis, runData, onLogout }) {
  const [view, setView] = useState("dashboard");
  const [editingActivity, setEditingActivity] = useState(null);
  const [viewingPlan, setViewingPlan] = useState(null);

  const [activities, setActivities] = useState(() => {
    const saved = db.load(user.username, "activities");
    if (saved && saved.length > 0) return saved;
    const initial = (runData && analysis)
      ? [{ id: 1, runData, analysis, nutritionItems: [], symptoms: [], feeling: 3, addedAt: new Date().toISOString() }]
      : [];
    if (initial.length > 0) db.save(user.username, "activities", initial);
    return initial;
  });

  const [savedPlans, setSavedPlans] = useState(() => db.load(user.username, "plans", []));

  function updateActivities(next) {
    setActivities(next);
    db.save(user.username, "activities", next);
  }

  function handleAddActivity(file) {
    const reader = new FileReader();
    reader.onload = e => {
      const result = parseActivityCSV(e.target.result);
      if (result) {
        const newAct = { id: Date.now(), runData: result, analysis: computeAnalysis(result, [], [], runType), nutritionItems: [], symptoms: [], feeling: 3, addedAt: new Date().toISOString() };
        const next = [...activities, newAct];
        updateActivities(next);
        setEditingActivity(newAct);
      }
    };
    reader.readAsText(file, "UTF-8");
  }

  function handleSaveActivity(updated) {
    const next = activities.map(a => a.id === updated.id ? updated : a);
    updateActivities(next);
    setEditingActivity(null);
  }

  function handleSavePlan(plan) {
    const next = [{ id: Date.now(), ...plan, createdAt: new Date().toISOString() }, ...savedPlans];
    setSavedPlans(next);
    db.save(user.username, "plans", next);
  }

  if (editingActivity) return (
    <NutritionEditModal activity={editingActivity} runType={runType}
      onSave={handleSaveActivity} onClose={() => setEditingActivity(null)} />
  );
  if (view === "plan" || viewingPlan) return (
    <PlanScreen profile={profile} runType={runType} analysis={analysis} runData={runData}
      onBack={() => { setView("dashboard"); setViewingPlan(null); }}
      onSavePlan={handleSavePlan}
      initialPlan={viewingPlan} />
  );
  return (
    <DashboardScreen profile={profile} runType={runType} activities={activities}
      savedPlans={savedPlans} onAddActivity={handleAddActivity}
      onEditActivity={setEditingActivity} onPlan={() => setView("plan")}
      onViewPlan={plan => { setViewingPlan(plan); setView("plan"); }}
      onLogout={onLogout} />
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<AppRoot />);

  </script>
</body>

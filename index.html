// ─── Plan Screen helper ─────────────────────────────────────────────────────
function StepperInput({ label, unit, value, min, max, step = 1, onChange, compact = false }) {
  const [editing, setEditing] = React.useState(false);
  const [raw, setRaw] = React.useState("");
  const inputRef = React.useRef(null);

  function startEdit() {
    setRaw(String(value));
    setEditing(true);
    setTimeout(() => inputRef.current?.select(), 0);
  }
  function commitEdit() {
    const n = parseInt(raw, 10);
    if (!isNaN(n)) onChange(Math.min(max, Math.max(min, n)));
    setEditing(false);
  }
  function handleKey(e) {
    if (e.key === "Enter") commitEdit();
    if (e.key === "Escape") setEditing(false);
  }

  const btn = {
    width: "30px", height: "30px", borderRadius: "8px",
    border: "1px solid rgba(148,163,184,0.15)",
    background: "rgba(15,23,42,0.5)", color: "#94a3b8",
    fontSize: "18px", cursor: "pointer", lineHeight: "28px", padding: 0, textAlign: "center",
  };
  if (compact) return (
    <div style={{ display: "flex", alignItems: "center", gap: "6px" }}>
      <button style={btn} onClick={() => onChange(Math.max(min, value - step))}>−</button>
      {editing ? (
        <input ref={inputRef} type="number" value={raw}
          onChange={e => setRaw(e.target.value)} onBlur={commitEdit} onKeyDown={handleKey}
          style={{ width: "40px", textAlign: "center", fontSize: "15px", fontWeight: "800", color: "#f1f5f9",
            background: "rgba(99,102,241,0.15)", border: "1px solid rgba(99,102,241,0.5)", borderRadius: "6px", outline: "none", padding: "2px 0" }} />
      ) : (
        <div onClick={startEdit} style={{ width: "40px", textAlign: "center", fontSize: "15px", fontWeight: "800", color: "#f1f5f9", cursor: "text" }}>{value}</div>
      )}
      <button style={btn} onClick={() => onChange(Math.min(max, value + step))}>+</button>
      <span style={{ fontSize: "11px", color: "#475569" }}>{unit}</span>
    </div>
  );
  return (
    <div style={{ display: "flex", alignItems: "center", padding: "10px 0", borderBottom: "1px solid rgba(148,163,184,0.06)" }}>
      <div style={{ flex: 1, fontSize: "13px", color: "#94a3b8" }}>{label}</div>
      <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
        <button style={btn} onClick={() => onChange(Math.max(min, value - step))}>−</button>
        {editing ? (
          <input
            ref={inputRef}
            type="number"
            value={raw}
            onChange={e => setRaw(e.target.value)}
            onBlur={commitEdit}
            onKeyDown={handleKey}
            style={{
              width: "52px", textAlign: "center", fontSize: "17px", fontWeight: "800",
              color: "#f1f5f9", background: "rgba(99,102,241,0.15)",
              border: "1px solid rgba(99,102,241,0.5)", borderRadius: "6px",
              outline: "none", padding: "2px 0",
            }}
          />
        ) : (
          <div
            onClick={startEdit}
            style={{ width: "52px", textAlign: "center", fontSize: "17px", fontWeight: "800", color: "#f1f5f9", cursor: "text" }}
          >{value}</div>
        )}
        <button style={btn} onClick={() => onChange(Math.min(max, value + step))}>+</button>
        <div style={{ fontSize: "11px", color: "#475569", width: "34px" }}>{unit}</div>
      </div>
    </div>
  );
}

// ─── GPX Parser ──────────────────────────────────────────────────────────────
function parseGPX(text) {
  try {
    const dom = new DOMParser().parseFromString(text, "application/xml");
    if (dom.querySelector("parsererror")) return null;
    const trkpts = [...dom.querySelectorAll("trkpt")];
    if (trkpts.length < 2) return null;
    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371, r = Math.PI / 180;
      const dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }
    let dist = 0, ascent = 0;
    for (let i = 1; i < trkpts.length; i++) {
      const prev = trkpts[i - 1], cur = trkpts[i];
      dist += haversine(
        +prev.getAttribute("lat"), +prev.getAttribute("lon"),
        +cur.getAttribute("lat"),  +cur.getAttribute("lon")
      );
      const eleP = parseFloat(prev.querySelector("ele")?.textContent ?? "0");
      const eleC = parseFloat(cur.querySelector("ele")?.textContent ?? "0");
      if (eleC > eleP) ascent += eleC - eleP;
    }
    const nameEl = dom.querySelector("metadata > name") || dom.querySelector("trk > name");
    return {
      dist: Math.round(dist * 10) / 10,
      ascent: Math.round(ascent / 10) * 10,
      name: nameEl?.textContent?.trim() || null,
    };
  } catch { return null; }
}

// ─── Plan Screen ────────────────────────────────────────────────────────────
function PlanScreen({ profile, runType, analysis, runData, onBack, onSavePlan, initialPlan }) {
  const [tab, setTab] = useState(initialPlan ? "timeline" : "setup");
  const [planSaved, setPlanSaved] = useState(!!initialPlan);
  const [planName, setPlanName] = useState(initialPlan?.planName ?? "マイプラン");
  const [aidStations, setAidStations] = useState(initialPlan?.aidStations ?? []);
  const [aidFoodInput, setAidFoodInput] = useState({});
  const [dropBagInput, setDropBagInput] = useState({});
  const [dropBagOpen, setDropBagOpen] = useState({});
  const [gpxError, setGpxError] = useState(null);
  const [distView, setDistView] = useState(false);
  const [editStep, setEditStep] = useState(null);
  const gpxRef = React.useRef(null);
  const [dist, setDist] = useState(() => initialPlan ? initialPlan.dist : Math.round(runData?.dist ?? 15));
  const [ascent, setAscent] = useState(() => initialPlan ? initialPlan.ascent : Math.round((runData?.ascent ?? 0) / 50) * 50);
  const [goalHrs, setGoalHrs] = useState(() => {
    if (initialPlan) return initialPlan.goalHrs ?? Math.floor((initialPlan.dist * (initialPlan.derivedPace || 10) + (initialPlan.ascent/100)*4) / 60);
    if (runData?.durationMins && runData?.dist > 0) return Math.floor(runData.durationMins / 60);
    const defaultPace = runType === "trail" ? 10 : 7;
    const d = Math.round(runData?.dist ?? 15);
    const a = Math.round((runData?.ascent ?? 0) / 50) * 50;
    return Math.floor(Math.round(d * defaultPace + (a / 100) * 4) / 60);
  });
  const [goalMin, setGoalMin] = useState(() => {
    if (initialPlan) return initialPlan.goalMin ?? Math.round((initialPlan.dist * (initialPlan.derivedPace || 10) + (initialPlan.ascent/100)*4) % 60);
    if (runData?.durationMins && runData?.dist > 0) return Math.round(runData.durationMins % 60);
    const defaultPace = runType === "trail" ? 10 : 7;
    const d = Math.round(runData?.dist ?? 15);
    const a = Math.round((runData?.ascent ?? 0) / 50) * 50;
    return Math.round(Math.round(d * defaultPace + (a / 100) * 4) % 60);
  });

  const estimatedMins = goalHrs * 60 + goalMin;
  const hrs = estimatedMins / 60;
  const derivedPace = dist > 0 && estimatedMins > 0
    ? Math.round((estimatedMins - (ascent / 100) * 4) / dist * 10) / 10
    : 0;
  function kmToMins(km) {
    return Math.round((estimatedMins / Math.max(dist, 1)) * km);
  }
  function addAid() {
    setAidStations(prev => [...prev, { id: Date.now(), km: Math.round(dist / 2), foods: [], dropBag: [], restMins: 0 }]);
  }
  function addDropBagItem(id) {
    const item = (dropBagInput[id] || "").trim();
    if (!item) return;
    setAidStations(prev => prev.map(a => a.id === id ? { ...a, dropBag: [...(a.dropBag||[]), item] } : a));
    setDropBagInput(prev => ({ ...prev, [id]: "" }));
  }
  function removeDropBagItem(aidId, idx) {
    setAidStations(prev => prev.map(a => a.id === aidId ? { ...a, dropBag: (a.dropBag||[]).filter((_, i) => i !== idx) } : a));
  }
  function handleGPX(file) {
    if (!file) return;
    setGpxError(null);
    const reader = new FileReader();
    reader.onload = e => {
      const result = parseGPX(e.target.result);
      if (result) {
        setDist(result.dist);
        setAscent(result.ascent);
        if (result.name) setPlanName(result.name);
        setPlanSaved(false);
      } else {
        setGpxError("GPXを読み取れませんでした。");
      }
    };
    reader.readAsText(file, "UTF-8");
  }
  function removeAid(id) {
    setAidStations(prev => prev.filter(a => a.id !== id));
  }
  function updateAidKm(id, km) {
    setAidStations(prev => prev.map(a => a.id === id ? { ...a, km: Math.min(dist, Math.max(0, km)) } : a));
  }
  function addAidFood(id) {
    const food = (aidFoodInput[id] || "").trim();
    if (!food) return;
    setAidStations(prev => prev.map(a => a.id === id ? { ...a, foods: [...a.foods, food] } : a));
    setAidFoodInput(prev => ({ ...prev, [id]: "" }));
  }
  function removeAidFood(aidId, foodIdx) {
    setAidStations(prev => prev.map(a => a.id === aidId ? { ...a, foods: a.foods.filter((_, i) => i !== foodIdx) } : a));
  }
  function updateAidRest(id, mins) {
    setAidStations(prev => prev.map(a => a.id === id ? { ...a, restMins: Math.max(0, mins) } : a));
  }

  const targetCarbsHr = (analysis?.carbScore ?? 70) < 65 ? 60 : 50;
  const targetWaterHr = runType === "trail" ? 500 : 400;
  const targetSodiumHr = (profile?.weight ?? 65) >= 70 ? 500 : 400;

  function generateTimeline(totalMins, rt) {
    const interval = totalMins <= 120 ? 20 : 30;
    const steps = [];
    for (let t = 0; t <= totalMins + interval / 2; t += interval) {
      const isStart = t === 0;
      const isFinish = t >= totalMins;
      const mins = isFinish ? totalMins : t;
      const items = [];
      if (isStart) { items.push({ id: "sports", qty: 500 }); }
      else if (isFinish) { items.push({ id: "cola", qty: 150 }); }
      else {
        const stepN = Math.round(t / interval);
        if (stepN % 2 === 0) { items.push({ id: "sports", qty: 300 }); }
        else { items.push({ id: "gel", qty: 1 }); items.push({ id: "water", qty: 200 }); }
        if (t >= 90 && Math.round(t % 120) < interval)
          items.push(rt === "trail" ? { id: "onigiri", qty: 1 } : { id: "salt", qty: 3 });
      }
      steps.push({ mins, isStart, isFinish, items });
      if (isFinish) break;
    }
    return steps;
  }

  const [timeline, setTimeline] = useState(() =>
    initialPlan?.timeline ?? generateTimeline(estimatedMins, runType)
  );

  function addItemToStep(stepIdx, presetId) {
    const p = NUTRITION_PRESETS.find(x => x.id === presetId);
    if (!p) return;
    setTimeline(prev => prev.map((s, i) => {
      if (i !== stepIdx) return s;
      if (s.items.find(x => x.id === presetId)) return s;
      return { ...s, items: [...s.items, { id: presetId, qty: p.defaultQty }] };
    }));
  }
  function removeItemFromStep(stepIdx, presetId) {
    setTimeline(prev => prev.map((s, i) =>
      i === stepIdx ? { ...s, items: s.items.filter(x => x.id !== presetId) } : s
    ));
  }
  function updateItemQty(stepIdx, presetId, delta) {
    setTimeline(prev => prev.map((s, i) => {
      if (i !== stepIdx) return s;
      const p = NUTRITION_PRESETS.find(x => x.id === presetId);
      const step = p?.unit === "ml" ? (p.defaultQty || 100) : 1;
      return { ...s, items: s.items.map(x =>
        x.id === presetId ? { ...x, qty: Math.max(step, x.qty + delta * step) } : x
      )};
    }));
  }

  const totals = useMemo(() => {
    let carbs = 0, water = 0, sodium = 0;
    timeline.forEach(step =>
      step.items.forEach(({ id, qty }) => {
        const p = NUTRITION_PRESETS.find(x => x.id === id);
        if (!p) return;
        const r = p.unit === "ml" ? qty / p.defaultQty : qty;
        carbs += p.carbs * r; water += p.water * r; sodium += p.sodium * r;
      })
    );
    return {
      carbsHr: hrs > 0 ? Math.round(carbs / hrs) : 0,
      waterHr: hrs > 0 ? Math.round(water / hrs) : 0,
      sodiumHr: hrs > 0 ? Math.round(sodium / hrs) : 0,
    };
  }, [timeline, hrs]);

  const bg = "linear-gradient(165deg, #0a0e17 0%, #111827 40%, #1a1a2e 100%)";
  const font = "'Noto Sans JP', 'SF Pro Display', -apple-system, sans-serif";
  const card = { ...cardBase, marginBottom: "12px" };

  return (
    <div style={{ minHeight: "100vh", background: bg, color: "#e2e8f0", fontFamily: font, maxWidth: "430px", margin: "0 auto" }}>
      <div style={{ position: "fixed", top: "-20%", right: "-10%", width: "50vw", height: "50vw", background: "radial-gradient(circle, rgba(99,102,241,0.08) 0%, transparent 70%)", pointerEvents: "none" }} />

      {/* Header */}
      <div style={{ padding: "28px 20px 0" }}>
        <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "2px" }}>
          <button onClick={onBack} style={{ background: "none", border: "none", color: "#64748b", fontSize: "13px", cursor: "pointer", padding: "0 6px 0 0", fontWeight: "700" }}>← 戻る</button>
          <span style={{ fontSize: "20px" }}>⚡</span>
          <span style={{ fontSize: "16px", fontWeight: "900", letterSpacing: "-0.5px", color: "#f8fafc" }}>FUEL LAB</span>
        </div>
        <div style={{ fontSize: "11px", color: "#475569" }}>補給プラン作成</div>
      </div>

      {/* Tabs */}
      <div style={{ display: "flex", margin: "16px 20px 0", background: "rgba(15,23,42,0.6)", borderRadius: "12px", padding: "4px" }}>
        {[["setup", "設定"], ["timeline", "タイムライン"]].map(([key, label]) => (
          <button key={key} onClick={() => setTab(key)} style={{
            flex: 1, padding: "9px", borderRadius: "9px", border: "none",
            background: tab === key ? "rgba(99,102,241,0.25)" : "transparent",
            color: tab === key ? "#a5b4fc" : "#475569",
            fontSize: "12px", fontWeight: "700", cursor: "pointer",
          }}>{label}</button>
        ))}
      </div>

      <div style={{ padding: "16px 20px 60px" }}>

        {/* ── 設定タブ ── */}
        {tab === "setup" && (
          <>
            <div style={{ fontSize: "11px", fontWeight: "700", color: "#64748b", letterSpacing: "2px", textTransform: "uppercase", marginBottom: "12px" }}>プラン名</div>
            <div style={{ ...card, padding: "12px 14px", marginBottom: "16px" }}>
              <input
                value={planName}
                onChange={e => { setPlanName(e.target.value); setPlanSaved(false); }}
                placeholder="例: UTMF A7 補給プラン"
                style={{
                  width: "100%", background: "transparent", border: "none", outline: "none",
                  fontSize: "16px", fontWeight: "800", color: "#f1f5f9",
                  fontFamily: "'Noto Sans JP','SF Pro Display',-apple-system,sans-serif",
                }}
              />
            </div>
            <div style={{ fontSize: "11px", fontWeight: "700", color: "#64748b", letterSpacing: "2px", textTransform: "uppercase", marginBottom: "12px" }}>次回レース設定</div>

            <div style={card}>
              <StepperInput label="距離" unit="km" value={dist} min={1} max={200} onChange={setDist} />
              <div style={{ display: "flex", alignItems: "center", padding: "10px 0", borderBottom: "1px solid rgba(148,163,184,0.06)" }}>
                <div style={{ flex: 1, fontSize: "13px", color: "#94a3b8" }}>目標タイム</div>
                <div style={{ display: "flex", alignItems: "center", gap: "6px" }}>
                  <StepperInput compact label="" unit="h" value={goalHrs} min={0} max={30} onChange={setGoalHrs} />
                  <StepperInput compact label="" unit="m" value={goalMin} min={0} max={59} step={5} onChange={setGoalMin} />
                </div>
              </div>
              <div style={{ display: "flex", alignItems: "center", padding: "8px 0" }}>
                <div style={{ flex: 1, fontSize: "12px", color: "#475569" }}>推定ペース</div>
                <div style={{ fontSize: "14px", fontWeight: "700", color: derivedPace > 0 ? "#a5b4fc" : "#334155" }}>
                  {derivedPace > 0 ? `${derivedPace} 分/km` : "—"}
                </div>
              </div>
              <StepperInput label="獲得標高" unit="m" value={ascent} min={0} max={5000} step={50} onChange={setAscent} />
            </div>

            {/* GPX読み込み */}
            <input ref={gpxRef} type="file" accept=".gpx" style={{ display:"none" }}
              onChange={e => { if (e.target.files[0]) { handleGPX(e.target.files[0]); e.target.value=""; } }} />
            <button onClick={() => gpxRef.current.click()} style={{
              width: "100%", padding: "11px", borderRadius: "12px", marginBottom: "12px",
              border: "1px dashed rgba(99,102,241,0.35)", background: "rgba(99,102,241,0.06)",
              color: "#818cf8", fontSize: "12px", fontWeight: "700", cursor: "pointer",
            }}>📍 GPXファイルを読み込む</button>
            {gpxError && <div style={{ fontSize: "11px", color: "#f87171", marginBottom: "10px", textAlign: "center" }}>{gpxError}</div>}

            <div style={{ ...card, textAlign: "center", padding: "24px 16px" }}>
              <div style={{ fontSize: "10px", color: "#64748b", letterSpacing: "2px", textTransform: "uppercase", marginBottom: "8px" }}>目標タイム</div>
              <div style={{ fontSize: "42px", fontWeight: "900", letterSpacing: "-2px", color: "#f8fafc" }}>{fmt(estimatedMins)}</div>
              <div style={{ fontSize: "11px", color: "#475569", marginTop: "4px" }}>{dist} km · ↑{ascent} m</div>
            </div>

            <div style={{ fontSize: "11px", fontWeight: "700", color: "#64748b", letterSpacing: "2px", textTransform: "uppercase", marginBottom: "12px" }}>目標補給量 / 時間</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "8px", marginBottom: "20px" }}>
              {[
                { label: "糖質", value: targetCarbsHr, unit: "g", color: "#fbbf24" },
                { label: "水分", value: targetWaterHr, unit: "ml", color: "#60a5fa" },
                { label: "Na", value: targetSodiumHr, unit: "mg", color: "#c4b5fd" },
              ].map(({ label, value, unit, color }) => (
                <div key={label} style={{ ...cardBase, textAlign: "center", padding: "14px 8px" }}>
                  <div style={{ fontSize: "10px", color: "#64748b", marginBottom: "4px" }}>{label}</div>
                  <div style={{ fontSize: "22px", fontWeight: "900", color }}>{value}</div>
                  <div style={{ fontSize: "9px", color: "#475569" }}>{unit}/hr</div>
                </div>
              ))}
            </div>

            {analysis && (
              <div style={{ padding: "12px 14px", borderRadius: "12px", background: "rgba(99,102,241,0.08)", border: "1px solid rgba(99,102,241,0.15)", fontSize: "11px", color: "#94a3b8", lineHeight: 1.7, marginBottom: "20px" }}>
                前回スコア <strong style={{ color: "#a5b4fc" }}>{analysis.overallScore}</strong>/100 をもとに目標値を設定しました。
              </div>
            )}

            <button onClick={() => setTab("timeline")} style={{
              width: "100%", padding: "16px", borderRadius: "14px", border: "none",
              background: "linear-gradient(135deg, #6366f1, #8b5cf6)",
              color: "#fff", fontSize: "15px", fontWeight: "800", cursor: "pointer",
              boxShadow: "0 8px 24px rgba(99,102,241,0.35)",
            }}>タイムラインを確認する →</button>
          </>
        )}

        {/* ── タイムラインタブ ── */}
        {tab === "timeline" && (
          <>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "12px" }}>
              <div style={{ fontSize: "11px", fontWeight: "700", color: "#64748b", letterSpacing: "2px", textTransform: "uppercase" }}>補給タイムライン</div>
              <div style={{ display: "flex", gap: "6px" }}>
                <button onClick={() => setDistView(v => !v)} style={{
                  background: "rgba(30,41,59,0.6)", border: "1px solid rgba(148,163,184,0.1)",
                  color: "#94a3b8", borderRadius: "8px", padding: "4px 10px", fontSize: "11px", fontWeight: "700", cursor: "pointer",
                }}>{distView ? "⏱ タイム" : "📍 距離"}</button>
                <button onClick={() => setTimeline(generateTimeline(estimatedMins, runType))} style={{
                  background: "rgba(30,41,59,0.6)", border: "1px solid rgba(148,163,184,0.1)",
                  color: "#64748b", borderRadius: "8px", padding: "4px 10px", fontSize: "11px", fontWeight: "700", cursor: "pointer",
                }}>↺ リセット</button>
              </div>
            </div>

            {/* 合計値 */}
            <div style={{ ...card, display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "8px", textAlign: "center", marginBottom: "16px" }}>
              {[
                { label: "糖質/h", value: totals.carbsHr, target: targetCarbsHr, unit: "g", color: "#fbbf24" },
                { label: "水分/h", value: totals.waterHr, target: targetWaterHr, unit: "ml", color: "#60a5fa" },
                { label: "Na/h", value: totals.sodiumHr, target: targetSodiumHr, unit: "mg", color: "#c4b5fd" },
              ].map(({ label, value, target, unit }) => {
                const ok = value >= target * 0.85 && value <= target * 1.2;
                const low = value < target * 0.85;
                return (
                  <div key={label}>
                    <div style={{ fontSize: "10px", color: "#64748b", marginBottom: "2px" }}>{label}</div>
                    <div style={{ fontSize: "20px", fontWeight: "900", color: ok ? "#4ade80" : low ? "#fbbf24" : "#f87171" }}>{value}</div>
                    <div style={{ fontSize: "9px", color: "#475569" }}>目標 {target}{unit}</div>
                  </div>
                );
              })}
            </div>

            {/* AIDポイント */}
            {runType === "trail" && (
              <div style={{ marginBottom: "20px" }}>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "10px" }}>
                  <div style={{ fontSize: "11px", fontWeight: "700", color: "#64748b", letterSpacing: "2px", textTransform: "uppercase" }}>AIDポイント</div>
                  <button onClick={addAid} style={{
                    background: "rgba(99,102,241,0.15)", border: "1px solid rgba(99,102,241,0.3)",
                    color: "#a5b4fc", borderRadius: "8px", padding: "5px 12px", fontSize: "12px", fontWeight: "700", cursor: "pointer",
                  }}>+ 追加</button>
                </div>
                {aidStations.length === 0 && (
                  <div style={{ fontSize: "11px", color: "#334155", padding: "12px 14px", borderRadius: "12px", background: "rgba(15,23,42,0.4)", border: "1px solid rgba(148,163,184,0.06)", textAlign: "center" }}>
                    AIDポイントなし
                  </div>
                )}
                {aidStations.map(aid => (
                  <div key={aid.id} style={{ ...cardBase, padding: "12px 14px", marginBottom: "8px" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "8px" }}>
                      <span style={{ fontSize: "13px" }}>🏁</span>
                      <div style={{ display: "flex", alignItems: "center", gap: "6px", flex: 1 }}>
                        <span style={{ fontSize: "12px", color: "#94a3b8" }}>km</span>
                        <input
                          type="number"
                          value={aid.km}
                          min={1} max={dist}
                          onChange={e => updateAidKm(aid.id, parseInt(e.target.value) || 0)}
                          style={{
                            width: "60px", background: "rgba(99,102,241,0.1)", border: "1px solid rgba(99,102,241,0.3)",
                            borderRadius: "6px", color: "#a5b4fc", fontSize: "14px", fontWeight: "800",
                            textAlign: "center", outline: "none", padding: "3px 0",
                            fontFamily: "'Noto Sans JP','SF Pro Display',-apple-system,sans-serif",
                          }}
                        />
                        <span style={{ fontSize: "11px", color: "#475569" }}>({fmt(kmToMins(aid.km))})</span>
                      </div>
                      <button onClick={() => removeAid(aid.id)} style={{ background: "none", border: "none", color: "#475569", cursor: "pointer", fontSize: "18px", padding: "0 4px", lineHeight: 1 }}>×</button>
                    </div>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: "5px", marginBottom: aid.foods.length > 0 ? "8px" : "0" }}>
                      {aid.foods.map((food, fi) => (
                        <div key={fi} style={{
                          display: "flex", alignItems: "center", gap: "4px",
                          padding: "3px 8px", borderRadius: "20px", fontSize: "11px", fontWeight: "600",
                          background: "rgba(34,197,94,0.1)", border: "1px solid rgba(34,197,94,0.2)", color: "#4ade80",
                        }}>
                          {food}
                          <span onClick={() => removeAidFood(aid.id, fi)} style={{ cursor: "pointer", color: "#64748b", fontWeight: "900", marginLeft: "2px" }}>×</span>
                        </div>
                      ))}
                    </div>
                    <div style={{ display: "flex", gap: "6px" }}>
                      <input
                        value={aidFoodInput[aid.id] || ""}
                        onChange={e => setAidFoodInput(prev => ({ ...prev, [aid.id]: e.target.value }))}
                        onKeyDown={e => e.key === "Enter" && addAidFood(aid.id)}
                        placeholder="AIDフード名を入力..."
                        style={{
                          flex: 1, background: "rgba(15,23,42,0.6)", border: "1px solid rgba(148,163,184,0.1)",
                          borderRadius: "8px", color: "#e2e8f0", fontSize: "12px", padding: "6px 10px",
                          outline: "none", fontFamily: "'Noto Sans JP','SF Pro Display',-apple-system,sans-serif",
                        }}
                      />
                      <button onClick={() => addAidFood(aid.id)} style={{
                        background: "rgba(99,102,241,0.15)", border: "1px solid rgba(99,102,241,0.3)",
                        color: "#a5b4fc", borderRadius: "8px", padding: "6px 12px", fontSize: "12px", fontWeight: "700", cursor: "pointer",
                      }}>追加</button>
                    </div>

                    {/* ドロップバッグ */}
                    <div style={{ marginTop: "10px", paddingTop: "10px", borderTop: "1px solid rgba(148,163,184,0.08)" }}>
                      <button onClick={() => setDropBagOpen(prev => ({ ...prev, [aid.id]: !prev[aid.id] }))} style={{
                        background: "none", border: "none", color: "#94a3b8", fontSize: "11px", fontWeight: "700",
                        cursor: "pointer", padding: "0", display: "flex", alignItems: "center", gap: "5px",
                      }}>
                        🎒 ドロップバッグ {dropBagOpen[aid.id] ? "▲" : "▼"}
                        {(aid.dropBag||[]).length > 0 && <span style={{ color: "#fbbf24", marginLeft: "4px" }}>{(aid.dropBag||[]).length}点</span>}
                      </button>
                      {dropBagOpen[aid.id] && (
                        <div style={{ marginTop: "8px" }}>
                          <div style={{ display: "flex", flexWrap: "wrap", gap: "5px", marginBottom: (aid.dropBag||[]).length > 0 ? "8px" : "0" }}>
                            {(aid.dropBag||[]).map((item, di) => (
                              <div key={di} style={{
                                display: "flex", alignItems: "center", gap: "4px",
                                padding: "3px 8px", borderRadius: "20px", fontSize: "11px", fontWeight: "600",
                                background: "rgba(251,191,36,0.1)", border: "1px solid rgba(251,191,36,0.25)", color: "#fbbf24",
                              }}>
                                {item}
                                <span onClick={() => removeDropBagItem(aid.id, di)} style={{ cursor: "pointer", color: "#64748b", fontWeight: "900", marginLeft: "2px" }}>×</span>
                              </div>
                            ))}
                          </div>
                          <div style={{ display: "flex", gap: "6px" }}>
                            <input
                              value={dropBagInput[aid.id] || ""}
                              onChange={e => setDropBagInput(prev => ({ ...prev, [aid.id]: e.target.value }))}
                              onKeyDown={e => e.key === "Enter" && addDropBagItem(aid.id)}
                              placeholder="バッグの中身を入力..."
                              style={{
                                flex: 1, background: "rgba(15,23,42,0.6)", border: "1px solid rgba(148,163,184,0.1)",
                                borderRadius: "8px", color: "#e2e8f0", fontSize: "12px", padding: "6px 10px",
                                outline: "none", fontFamily: "'Noto Sans JP','SF Pro Display',-apple-system,sans-serif",
                              }}
                            />
                            <button onClick={() => addDropBagItem(aid.id)} style={{
                              background: "rgba(251,191,36,0.12)", border: "1px solid rgba(251,191,36,0.3)",
                              color: "#fbbf24", borderRadius: "8px", padding: "6px 12px", fontSize: "12px", fontWeight: "700", cursor: "pointer",
                            }}>追加</button>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* タイムライン */}
            <div style={{ position: "relative" }}>
              <div style={{ position: "absolute", left: "21px", top: "20px", bottom: "20px", width: "2px", background: "rgba(99,102,241,0.12)" }} />
              {(() => {
                const sortedAids = [...aidStations].sort((a, b) => a.km - b.km);

                // Build unified sorted event list (real steps + AIDs)
                const events = [];
                timeline.forEach((step, idx) => {
                  events.push({ type: "step", mins: step.mins, step, idx, key: "step_" + idx });
                });
                sortedAids.forEach(aid => {
                  events.push({ type: "aid", mins: kmToMins(aid.km), aid, key: "aid_" + aid.id });
                });
                events.sort((a, b) => a.mins - b.mins || (a.type === "aid" ? -1 : 1));

                // Fill 30-min gaps with virtual rows
                const rows = [];
                let lastMins = -1;
                for (const event of events) {
                  if (lastMins >= 0 && event.mins - lastMins > 35) {
                    const fillStart = Math.ceil((lastMins + 1) / 30) * 30;
                    for (let m = fillStart; m < event.mins - 10; m += 30) {
                      rows.push({ type: "virtual", mins: m, key: "virt_" + m });
                    }
                  }
                  rows.push(event);
                  lastMins = event.mins;
                }

                const btnSm = { background: "none", border: "none", color: "#4ade80", cursor: "pointer", fontSize: "14px", padding: "0 3px", lineHeight: 1 };

                return rows.map(row => {
                  if (row.type === "virtual") {
                    return (
                      <div key={row.key} style={{ display: "flex", gap: "12px", marginBottom: "10px", alignItems: "flex-start" }}>
                        <div style={{ width: "44px", flexShrink: 0, display: "flex", flexDirection: "column", alignItems: "center", gap: "3px" }}>
                          <div style={{ width: "8px", height: "8px", borderRadius: "50%", marginTop: "10px", zIndex: 1, position: "relative", background: "rgba(99,102,241,0.2)", border: "1px solid rgba(99,102,241,0.2)" }} />
                          <div style={{ fontSize: "9px", color: "#334155", fontWeight: "600" }}>
                            {distView ? `${Math.round(row.mins / Math.max(estimatedMins, 1) * dist * 10) / 10}km` : fmt(row.mins)}
                          </div>
                        </div>
                        <div style={{ flex: 1, padding: "6px 12px", borderRadius: "10px", background: "rgba(15,23,42,0.2)", border: "1px solid rgba(148,163,184,0.04)" }}>
                          <span style={{ fontSize: "10px", color: "#1e293b" }}>補給なし</span>
                        </div>
                      </div>
                    );
                  }
                  if (row.type === "aid") {
                    const { aid } = row;
                    return (
                      <div key={row.key} style={{ display: "flex", gap: "12px", marginBottom: "10px", alignItems: "flex-start" }}>
                        <div style={{ width: "44px", flexShrink: 0, display: "flex", flexDirection: "column", alignItems: "center", gap: "3px" }}>
                          <div style={{
                            width: "12px", height: "12px", borderRadius: "3px", marginTop: "8px", zIndex: 1, position: "relative",
                            background: "#22c55e", border: "2px solid #4ade80", boxShadow: "0 0 8px rgba(34,197,94,0.6)",
                          }} />
                          <div style={{ fontSize: "9px", color: "#4ade80", fontWeight: "700" }}>
                            {distView ? `${aid.km}km` : fmt(kmToMins(aid.km))}
                          </div>
                        </div>
                        <div style={{
                          flex: 1, padding: "8px 12px", borderRadius: "12px",
                          background: "rgba(34,197,94,0.07)", border: "1px solid rgba(34,197,94,0.2)",
                        }}>
                          <div style={{ fontSize: "10px", color: "#4ade80", fontWeight: "700", marginBottom: "5px" }}>🏁 AID {aid.km}km</div>
                          <div style={{ display: "flex", flexWrap: "wrap", gap: "5px" }}>
                            {aid.foods.length === 0
                              ? <span style={{ fontSize: "11px", color: "#334155" }}>フードなし</span>
                              : aid.foods.map((food, fi) => (
                                  <div key={fi} style={{
                                    padding: "3px 9px", borderRadius: "20px", fontSize: "11px", fontWeight: "600",
                                    background: "rgba(34,197,94,0.12)", border: "1px solid rgba(34,197,94,0.2)", color: "#4ade80",
                                  }}>{food}</div>
                                ))
                            }
                          </div>
                          {(aid.dropBag||[]).length > 0 && (
                            <div style={{ marginTop: "6px", paddingTop: "6px", borderTop: "1px solid rgba(251,191,36,0.15)" }}>
                              <div style={{ fontSize: "9px", color: "#92400e", fontWeight: "700", marginBottom: "4px" }}>🎒 ドロップバッグ</div>
                              <div style={{ display: "flex", flexWrap: "wrap", gap: "5px" }}>
                                {(aid.dropBag||[]).map((item, di) => (
                                  <div key={di} style={{
                                    padding: "3px 9px", borderRadius: "20px", fontSize: "11px", fontWeight: "600",
                                    background: "rgba(251,191,36,0.1)", border: "1px solid rgba(251,191,36,0.25)", color: "#fbbf24",
                                  }}>{item}</div>
                                ))}
                              </div>
                            </div>
                          )}
                          <div style={{ marginTop: "8px", paddingTop: "6px", borderTop: "1px solid rgba(34,197,94,0.12)", display: "flex", alignItems: "center", gap: "6px" }}>
                            <span style={{ fontSize: "10px", color: "#4ade80" }}>⏸ 休憩</span>
                            <button style={btnSm} onClick={() => updateAidRest(aid.id, (aid.restMins||0) - 5)}>−</button>
                            <span style={{ fontSize: "12px", fontWeight: "700", color: "#4ade80", minWidth: "30px", textAlign: "center" }}>{aid.restMins || 0}分</span>
                            <button style={btnSm} onClick={() => updateAidRest(aid.id, (aid.restMins||0) + 5)}>+</button>
                          </div>
                        </div>
                      </div>
                    );
                  }
                  const { step } = row;
                  return (
                <div key={row.key} style={{ display: "flex", gap: "12px", marginBottom: "10px", alignItems: "flex-start" }}>
                  <div style={{ width: "44px", flexShrink: 0, display: "flex", flexDirection: "column", alignItems: "center", gap: "3px" }}>
                    <div style={{
                      width: "12px", height: "12px", borderRadius: "50%", marginTop: "8px", zIndex: 1, position: "relative",
                      background: step.isStart || step.isFinish ? "#6366f1" : "rgba(99,102,241,0.4)",
                      border: `2px solid ${step.isStart || step.isFinish ? "#818cf8" : "rgba(99,102,241,0.3)"}`,
                      boxShadow: step.isStart || step.isFinish ? "0 0 8px rgba(99,102,241,0.6)" : "none",
                    }} />
                    <div style={{ fontSize: "9px", color: step.isStart || step.isFinish ? "#818cf8" : "#475569", fontWeight: "700" }}>
                      {distView
                        ? `${Math.round(step.mins / Math.max(estimatedMins, 1) * dist * 10) / 10}km`
                        : fmt(step.mins)}
                    </div>
                  </div>
                  <div style={{
                    flex: 1, padding: "8px 12px", borderRadius: "12px",
                    background: step.isStart || step.isFinish ? "rgba(99,102,241,0.1)" : "rgba(30,41,59,0.4)",
                    border: `1px solid ${step.isStart || step.isFinish ? "rgba(99,102,241,0.2)" : "rgba(148,163,184,0.07)"}`,
                  }}>
                    {step.isStart && <div style={{ fontSize: "10px", color: "#818cf8", fontWeight: "700", marginBottom: "5px" }}>スタート</div>}
                    {step.isFinish && <div style={{ fontSize: "10px", color: "#818cf8", fontWeight: "700", marginBottom: "5px" }}>フィニッシュ</div>}
                    <div style={{ display: "flex", flexWrap: "wrap", gap: "5px", marginBottom: "6px" }}>
                      {step.items.map(({ id, qty }, j) => {
                        const p = NUTRITION_PRESETS.find(x => x.id === id);
                        if (!p) return null;
                        const isEditing = editStep === row.idx;
                        return (
                          <div key={j} style={{
                            display: "flex", alignItems: "center", gap: "3px",
                            padding: "3px 6px 3px 9px", borderRadius: "20px", fontSize: "11px", fontWeight: "600",
                            background: "rgba(99,102,241,0.12)", border: "1px solid rgba(99,102,241,0.18)", color: "#a5b4fc",
                          }}>
                            {p.icon} {p.name}
                            {isEditing ? (
                              <>
                                <button onClick={() => updateItemQty(row.idx, id, -1)} style={{ background:"none",border:"none",color:"#64748b",cursor:"pointer",fontSize:"13px",padding:"0 2px",lineHeight:1 }}>−</button>
                                <span style={{ color: "#64748b", minWidth: "30px", textAlign:"center" }}>{qty}{p.unit}</span>
                                <button onClick={() => updateItemQty(row.idx, id, 1)} style={{ background:"none",border:"none",color:"#64748b",cursor:"pointer",fontSize:"13px",padding:"0 2px",lineHeight:1 }}>+</button>
                                <span onClick={() => removeItemFromStep(row.idx, id)} style={{ cursor:"pointer",color:"#475569",fontWeight:"900",padding:"0 2px" }}>×</span>
                              </>
                            ) : (
                              <span style={{ color: "#64748b" }}>{qty}{p.unit}</span>
                            )}
                          </div>
                        );
                      })}
                      <button onClick={() => setEditStep(editStep === row.idx ? null : row.idx)} style={{
                        padding: "3px 8px", borderRadius: "20px", fontSize: "11px", fontWeight: "700",
                        background: editStep === row.idx ? "rgba(99,102,241,0.2)" : "rgba(30,41,59,0.5)",
                        border: "1px dashed rgba(148,163,184,0.2)", color: "#64748b", cursor: "pointer",
                      }}>{editStep === row.idx ? "完了" : "✏"}</button>
                    </div>
                    {editStep === row.idx && (
                      <div style={{ display: "flex", flexWrap: "wrap", gap: "4px", paddingTop: "6px", borderTop: "1px solid rgba(148,163,184,0.07)" }}>
                        {NUTRITION_PRESETS.map(p => {
                          const has = step.items.find(x => x.id === p.id);
                          return (
                            <div key={p.id} onClick={() => has ? removeItemFromStep(row.idx, p.id) : addItemToStep(row.idx, p.id)} style={{
                              padding: "3px 8px", borderRadius: "16px", fontSize: "10px", fontWeight: "600",
                              cursor: "pointer", border: "1px solid",
                              background: has ? "rgba(99,102,241,0.15)" : "rgba(15,23,42,0.5)",
                              borderColor: has ? "rgba(99,102,241,0.4)" : "rgba(148,163,184,0.1)",
                              color: has ? "#a5b4fc" : "#475569",
                            }}>{p.icon} {p.name}</div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>
                  );
                });
              })()}
            </div>

            <button onClick={() => { onSavePlan({ planName, dist, goalHrs, goalMin, derivedPace, ascent, targetCarbsHr, targetWaterHr, targetSodiumHr, timeline, aidStations }); setPlanSaved(true); }} style={{
              width: "100%", padding: "14px", borderRadius: "14px", border: "none",
              background: planSaved ? "rgba(34,197,94,0.15)" : "linear-gradient(135deg, #6366f1, #8b5cf6)",
              border: planSaved ? "1px solid rgba(34,197,94,0.3)" : "none",
              color: planSaved ? "#4ade80" : "#fff", fontSize: "14px", fontWeight: "800", cursor: "pointer",
              marginBottom: "12px",
            }}>
              {planSaved ? "✅ 保存済み" : "💾 このプランを保存"}
            </button>

            <div style={{ marginTop: "12px", padding: "12px 14px", borderRadius: "12px", background: "rgba(15,23,42,0.4)", border: "1px solid rgba(148,163,184,0.06)", fontSize: "11px", color: "#475569", textAlign: "center" }}>
              スクリーンショットして当日に活用しよう 📸
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function ProductSearchModal({ selectedIds, onAdd, onRemove, onClose }) {
  const [search, setSearch] = React.useState("");
  const [typeFilter, setTypeFilter] = React.useState("all");

  const TYPE_LABELS = { all: "すべて", gel: "ジェル", drink: "ドリンク/ゼリー", bar: "バー" };

  const filtered = PRODUCT_DATABASE.filter(p => {
    const matchType = typeFilter === "all" || p.type === typeFilter;
    const q = search.toLowerCase();
    const matchSearch = !q || p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q) || (p.note && p.note.toLowerCase().includes(q));
    return matchType && matchSearch;
  });

  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.93)", zIndex:300, overflowY:"auto" }}>
      <div style={{ maxWidth:430, margin:"0 auto", padding:"20px 16px 100px", fontFamily:"'Noto Sans JP','SF Pro Display',-apple-system,sans-serif", color:"#e2e8f0" }}>
        <div style={{ display:"flex", alignItems:"center", gap:"12px", marginBottom:"16px", paddingTop:"8px" }}>
          <button onClick={onClose} style={{ background:"rgba(30,41,59,0.8)", border:"1px solid rgba(148,163,184,0.1)", color:"#94a3b8", borderRadius:"10px", padding:"8px 14px", cursor:"pointer", fontSize:"13px", fontWeight:"700" }}>← 戻る</button>
          <div>
            <div style={{ fontSize:"16px", fontWeight:"800", color:"#f1f5f9" }}>🗃️ 商品データベース</div>
            <div style={{ fontSize:"11px", color:"#64748b" }}>人気ブランドのジェル・ドリンク</div>
          </div>
        </div>
        <input placeholder="🔍 商品名・ブランドで検索..." value={search} onChange={e => setSearch(e.target.value)}
          style={{ width:"100%", padding:"12px 14px", borderRadius:"12px", border:"1px solid rgba(148,163,184,0.15)", background:"rgba(15,23,42,0.8)", color:"#e2e8f0", fontSize:"14px", outline:"none", fontFamily:"inherit", marginBottom:"10px" }} />
        <div style={{ display:"flex", gap:"6px", marginBottom:"16px", overflowX:"auto" }}>
          {Object.entries(TYPE_LABELS).map(([val, label]) => (
            <button key={val} onClick={() => setTypeFilter(val)} style={{
              padding:"6px 14px", borderRadius:"20px", border:"none", cursor:"pointer", whiteSpace:"nowrap",
              background: typeFilter === val ? "rgba(99,102,241,0.25)" : "rgba(30,41,59,0.6)",
              color: typeFilter === val ? "#a5b4fc" : "#64748b", fontSize:"12px", fontWeight:"700",
            }}>{label}</button>
          ))}
        </div>
        <div style={{ display:"flex", flexDirection:"column", gap:"8px" }}>
          {filtered.map(product => {
            const isSelected = selectedIds.includes(product.id);
            return (
              <div key={product.id} onClick={() => isSelected ? onRemove(product.id) : onAdd(product)} style={{
                padding:"14px", borderRadius:"14px", cursor:"pointer",
                background: isSelected ? "rgba(34,197,94,0.1)" : "rgba(30,41,59,0.5)",
                border: `1px solid ${isSelected ? "rgba(34,197,94,0.35)" : "rgba(148,163,184,0.08)"}`,
              }}>
                <div style={{ display:"flex", alignItems:"flex-start", gap:"12px" }}>
                  <span style={{ fontSize:"22px", flexShrink:0 }}>{product.icon}</span>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:"6px", marginBottom:"2px" }}>
                      <span style={{ fontSize:"10px", fontWeight:"700", color:"#64748b", background:"rgba(100,116,139,0.15)", padding:"1px 7px", borderRadius:"6px" }}>{product.brand}</span>
                      {isSelected && <span style={{ fontSize:"10px", fontWeight:"700", color:"#4ade80" }}>✓ 追加済み</span>}
                    </div>
                    <div style={{ fontSize:"13px", fontWeight:"800", color: isSelected ? "#4ade80" : "#f1f5f9", marginBottom:"3px" }}>{product.name}</div>
                    <div style={{ fontSize:"11px", color:"#64748b", marginBottom:"5px" }}>{product.serving}</div>
                    <div style={{ display:"flex", gap:"6px", flexWrap:"wrap" }}>
                      {product.carbs > 0  && <span style={{ fontSize:"10px", fontWeight:"700", color:"#fbbf24", background:"rgba(251,191,36,0.12)", padding:"2px 7px", borderRadius:"6px" }}>糖 {product.carbs}g</span>}
                      {product.sodium > 0 && <span style={{ fontSize:"10px", fontWeight:"700", color:"#c4b5fd", background:"rgba(196,181,253,0.12)", padding:"2px 7px", borderRadius:"6px" }}>Na {product.sodium}mg</span>}
                      {product.k > 0      && <span style={{ fontSize:"10px", fontWeight:"700", color:"#4ade80", background:"rgba(74,222,128,0.12)", padding:"2px 7px", borderRadius:"6px" }}>K {product.k}mg</span>}
                      {product.mg > 0     && <span style={{ fontSize:"10px", fontWeight:"700", color:"#34d399", background:"rgba(52,211,153,0.12)", padding:"2px 7px", borderRadius:"6px" }}>Mg {product.mg}mg</span>}
                      {product.water > 0  && <span style={{ fontSize:"10px", fontWeight:"700", color:"#60a5fa", background:"rgba(96,165,250,0.12)", padding:"2px 7px", borderRadius:"6px" }}>水 {product.water}ml</span>}
                    </div>
                    {product.note && <div style={{ fontSize:"10px", color:"#475569", marginTop:"5px" }}>{product.note}</div>}
                  </div>
                </div>
              </div>
            );
          })}
          {filtered.length === 0 && <div style={{ textAlign:"center", padding:"40px 0", color:"#475569", fontSize:"13px" }}>「{search}」は見つかりませんでした</div>}
        </div>
      </div>
    </div>
  );
}

function CustomDrinkModal({ onAdd, onClose }) {
  const [name, setName] = React.useState("マイドリンク");
  const [waterAmt, setWaterAmt] = React.useState(500);
  const [amounts, setAmounts] = React.useState({});

  const setAmt = (id, val) => setAmounts(prev => ({ ...prev, [id]: Math.max(0, val) }));

  const totalCarbs = DRINK_INGREDIENTS.reduce((s, ing) => s + (amounts[ing.id] || 0) * ing.carbsPerG, 0);
  const totalNa    = DRINK_INGREDIENTS.reduce((s, ing) => s + (amounts[ing.id] || 0) * ing.naPerG,    0);
  const totalMg    = DRINK_INGREDIENTS.reduce((s, ing) => s + (amounts[ing.id] || 0) * ing.mgPerG,    0);

  function handleAdd() {
    onAdd({
      id: `custom_drink_${Date.now()}`,
      name: name || "カスタムドリンク",
      qty: 1, unit: "本",
      carbs: Math.round(totalCarbs), water: waterAmt,
      sodium: Math.round(totalNa), k: 0, mg: Math.round(totalMg),
    });
    onClose();
  }

  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.93)", zIndex:300, overflowY:"auto" }}>
      <div style={{ maxWidth:430, margin:"0 auto", padding:"20px 16px 100px", fontFamily:"'Noto Sans JP','SF Pro Display',-apple-system,sans-serif", color:"#e2e8f0" }}>
        <div style={{ display:"flex", alignItems:"center", gap:"12px", marginBottom:"20px", paddingTop:"8px" }}>
          <button onClick={onClose} style={{ background:"rgba(30,41,59,0.8)", border:"1px solid rgba(148,163,184,0.1)", color:"#94a3b8", borderRadius:"10px", padding:"8px 14px", cursor:"pointer", fontSize:"13px", fontWeight:"700" }}>← 戻る</button>
          <div>
            <div style={{ fontSize:"16px", fontWeight:"800", color:"#f1f5f9" }}>🧪 カスタムドリンク</div>
            <div style={{ fontSize:"11px", color:"#64748b" }}>成分を配合してオリジナルを作る</div>
          </div>
        </div>

        <div style={{ marginBottom:"14px" }}>
          <div style={{ fontSize:"11px", color:"#64748b", marginBottom:"5px", fontWeight:"700" }}>ドリンク名</div>
          <input value={name} onChange={e => setName(e.target.value)} placeholder="マイドリンク"
            style={{ width:"100%", padding:"10px 14px", borderRadius:"10px", border:"1px solid rgba(148,163,184,0.15)", background:"rgba(15,23,42,0.8)", color:"#e2e8f0", fontSize:"14px", fontFamily:"inherit", outline:"none" }} />
        </div>

        <div style={{ marginBottom:"18px", padding:"14px", borderRadius:"12px", background:"rgba(96,165,250,0.06)", border:"1px solid rgba(96,165,250,0.15)" }}>
          <div style={{ fontSize:"11px", color:"#60a5fa", fontWeight:"700", marginBottom:"8px" }}>💧 水の量</div>
          <div style={{ display:"flex", alignItems:"center", gap:"10px" }}>
            <button onClick={() => setWaterAmt(w => Math.max(100, w - 100))} style={{ width:"32px", height:"32px", borderRadius:"8px", border:"none", background:"rgba(148,163,184,0.1)", color:"#94a3b8", cursor:"pointer", fontSize:"18px" }}>−</button>
            <div style={{ flex:1, textAlign:"center", fontSize:"20px", fontWeight:"900", color:"#60a5fa" }}>{waterAmt}ml</div>
            <button onClick={() => setWaterAmt(w => w + 100)} style={{ width:"32px", height:"32px", borderRadius:"8px", border:"none", background:"rgba(96,165,250,0.15)", color:"#60a5fa", cursor:"pointer", fontSize:"18px" }}>＋</button>
          </div>
        </div>

        <div style={{ fontSize:"11px", color:"#64748b", fontWeight:"700", marginBottom:"8px", letterSpacing:"1px", textTransform:"uppercase" }}>成分を配合</div>
        <div style={{ display:"flex", flexDirection:"column", gap:"7px", marginBottom:"18px" }}>
          {DRINK_INGREDIENTS.map(ing => {
            const amt = amounts[ing.id] || 0;
            const isActive = amt > 0;
            const step = ing.unit === "mg" ? 25 : 5;
            return (
              <div key={ing.id} style={{ padding:"11px 13px", borderRadius:"12px", background: isActive ? ing.color + "0e" : "rgba(30,41,59,0.4)", border:`1px solid ${isActive ? ing.color + "30" : "rgba(148,163,184,0.08)"}` }}>
                <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom: isActive ? "10px" : 0 }}>
                  <div style={{ width:"34px", height:"34px", borderRadius:"8px", background:`${ing.color}15`, border:`1px solid ${ing.color}35`, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                    <span style={{ fontSize:"10px", fontWeight:"900", color:ing.color }}>{ing.abbr}</span>
                  </div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:"13px", fontWeight:"700", color: isActive ? ing.color : "#94a3b8" }}>{ing.name}</div>
                    <div style={{ fontSize:"10px", color:"#475569", marginTop:"1px" }}>{ing.note}</div>
                  </div>
                  <button onClick={() => setAmt(ing.id, isActive ? 0 : step)} style={{ padding:"5px 10px", borderRadius:"8px", border:"none", cursor:"pointer", background: isActive ? `${ing.color}20` : "rgba(30,41,59,0.8)", color: isActive ? ing.color : "#64748b", fontSize:"12px", fontWeight:"700" }}>
                    {isActive ? "削除" : "+ 追加"}
                  </button>
                </div>
                {isActive && (
                  <div style={{ display:"flex", alignItems:"center", gap:"10px" }}>
                    <button onClick={() => setAmt(ing.id, amt - step)} style={{ width:"30px", height:"30px", borderRadius:"8px", border:"none", background:"rgba(148,163,184,0.12)", color:"#94a3b8", cursor:"pointer", fontSize:"16px" }}>−</button>
                    <div style={{ flex:1, textAlign:"center" }}>
                      <span style={{ fontSize:"18px", fontWeight:"900", color:ing.color }}>{amt}</span>
                      <span style={{ fontSize:"12px", color:"#64748b", marginLeft:"3px" }}>{ing.unit}</span>
                    </div>
                    <button onClick={() => setAmt(ing.id, amt + step)} style={{ width:"30px", height:"30px", borderRadius:"8px", border:"none", background:`${ing.color}18`, color:ing.color, cursor:"pointer", fontSize:"16px" }}>＋</button>
                  </div>
                )}
              </div>
            );
          })}
        </div>

        <div style={{ padding:"14px", borderRadius:"14px", background:"rgba(15,23,42,0.8)", border:"1px solid rgba(148,163,184,0.1)", marginBottom:"18px" }}>
          <div style={{ fontSize:"10px", color:"#64748b", fontWeight:"700", marginBottom:"10px", letterSpacing:"1px" }}>栄養サマリー (1本分)</div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:"6px" }}>
            {[
              { label:"糖質", val:Math.round(totalCarbs), unit:"g",  color:"#fbbf24" },
              { label:"水分", val:waterAmt,               unit:"ml", color:"#60a5fa" },
              { label:"Na",   val:Math.round(totalNa),    unit:"mg", color:"#c4b5fd" },
              { label:"Mg",   val:Math.round(totalMg),    unit:"mg", color:"#34d399" },
            ].map(({ label, val, unit, color }) => (
              <div key={label} style={{ textAlign:"center" }}>
                <div style={{ fontSize:"9px", color:"#64748b", marginBottom:"3px" }}>{label}</div>
                <div style={{ fontSize:"16px", fontWeight:"900", color }}>{val}<span style={{ fontSize:"9px" }}>{unit}</span></div>
              </div>
            ))}
          </div>
        </div>

        <button onClick={handleAdd} style={{ width:"100%", padding:"16px", borderRadius:"14px", border:"none", background:"linear-gradient(135deg, #6366f1, #8b5cf6)", color:"#fff", fontSize:"15px", fontWeight:"800", cursor:"pointer", boxShadow:"0 8px 24px rgba(99,102,241,0.3)" }}>
          このドリンクを追加する →
        </button>
      </div>
    </div>
  );
}

function NutritionEditModal({ activity, runType, onSave, onClose }) {
  const [nutritionItems, setNutritionItems] = useState(activity.nutritionItems || []);
  const [symptoms, setSymptoms]   = useState(activity.symptoms || []);
  const [feeling,  setFeeling]    = useState(activity.feeling  || 3);
  const [showProductSearch, setShowProductSearch] = useState(false);
  const [showCustomDrink,   setShowCustomDrink]   = useState(false);

  function addProductItem(product) {
    setNutritionItems(prev => {
      if (prev.find(i => i.id === product.id)) return prev;
      return [...prev, { id: product.id, qty: product.defaultQty, name: product.name, unit: product.unit, carbs: product.carbs, sodium: product.sodium, water: product.water, k: product.k ?? 0, mg: product.mg ?? 0 }];
    });
  }
  function removeProductItem(id) {
    setNutritionItems(prev => prev.filter(i => i.id !== id));
  }
  function addCustomDrinkItem(item) {
    setNutritionItems(prev => [...prev, item]);
  }

  function toggleNutrition(id) {
    setNutritionItems(prev => {
      const p = NUTRITION_PRESETS.find(x => x.id === id);
      if (prev.find(i => i.id === id)) return prev.filter(i => i.id !== id);
      return [...prev, { id, qty: p.defaultQty, carbs: p.carbs, sodium: p.sodium, water: p.water, k: p.k ?? 0, mg: p.mg ?? 0 }];
    });
  }
  function updateQty(id, qty) {
    setNutritionItems(prev => prev.map(i => i.id === id ? { ...i, qty } : i));
  }
  function toggleSymptom(id) {
    setSymptoms(prev => {
      if (id === "none") return [{ id: "none", km: 0 }];
      const filtered = prev.filter(s => s.id !== "none");
      if (filtered.find(s => s.id === id)) return filtered.filter(s => s.id !== id);
      return [...filtered, { id, km: 0 }];
    });
  }
  function handleSave() {
    const newAnalysis = computeAnalysis(activity.runData, nutritionItems, symptoms, runType);
    onSave({ ...activity, nutritionItems, symptoms, feeling, analysis: newAnalysis });
  }

  const FEELING_OPTIONS = [
    { val: 1, icon: "😫", label: "ひどかった" }, { val: 2, icon: "😕", label: "きつかった" },
    { val: 3, icon: "😐", label: "普通" },       { val: 4, icon: "😊", label: "良かった" },
    { val: 5, icon: "🤩", label: "最高！" },
  ];

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.85)", zIndex: 200, overflowY: "auto" }}>
      <div style={{ maxWidth: 430, margin: "0 auto", padding: "20px 20px 100px",
        fontFamily: "'Noto Sans JP','SF Pro Display',-apple-system,sans-serif", color: "#e2e8f0" }}>

        {/* Header */}
        <div style={{ display: "flex", alignItems: "center", gap: "12px", marginBottom: "20px", paddingTop: "8px" }}>
          <button onClick={onClose} style={{ background: "rgba(30,41,59,0.8)", border: "1px solid rgba(148,163,184,0.1)", color: "#94a3b8", borderRadius: "10px", padding: "8px 14px", cursor: "pointer", fontSize: "13px", fontWeight: "700" }}>✕ 閉じる</button>
          <div>
            <div style={{ fontSize: "16px", fontWeight: "800", color: "#f1f5f9" }}>補給を記録</div>
            <div style={{ fontSize: "11px", color: "#64748b" }}>{activity.runData.title || "トレーニングラン"}</div>
          </div>
        </div>

        {/* Run summary */}
        <div style={{ ...cardBase, marginBottom: "20px", padding: "12px 16px", display: "flex", gap: "16px", fontSize: "11px", color: "#94a3b8" }}>
          <span>📍 {(activity.runData.dist || 0).toFixed(1)}km</span>
          <span>⏱ {fmt(activity.runData.durationMins)}</span>
          {activity.runData.ascent > 0 && <span>↑{activity.runData.ascent}m</span>}
        </div>

        {/* Modals */}
        {showProductSearch && (
          <ProductSearchModal
            selectedIds={nutritionItems.map(i => i.id)}
            onAdd={p => { addProductItem(p); }}
            onRemove={id => removeProductItem(id)}
            onClose={() => setShowProductSearch(false)}
          />
        )}
        {showCustomDrink && (
          <CustomDrinkModal
            onAdd={item => addCustomDrinkItem(item)}
            onClose={() => setShowCustomDrink(false)}
          />
        )}

        {/* Nutrition picker */}
        <div style={{ fontSize: "13px", fontWeight: "700", color: "#94a3b8", letterSpacing: "1px", textTransform: "uppercase", marginBottom: "10px" }}>補給したもの</div>

        {/* Action buttons */}
        <div style={{ display: "flex", gap: "8px", marginBottom: "12px" }}>
          <button onClick={() => setShowProductSearch(true)} style={{ flex: 1, padding: "11px 8px", borderRadius: "12px", border: "1px solid rgba(99,102,241,0.3)", background: "rgba(99,102,241,0.08)", color: "#a5b4fc", cursor: "pointer", fontSize: "12px", fontWeight: "700", display: "flex", alignItems: "center", justifyContent: "center", gap: "5px" }}>
            🗃️ 商品から探す
          </button>
          <button onClick={() => setShowCustomDrink(true)} style={{ flex: 1, padding: "11px 8px", borderRadius: "12px", border: "1px solid rgba(52,211,153,0.3)", background: "rgba(52,211,153,0.08)", color: "#34d399", cursor: "pointer", fontSize: "12px", fontWeight: "700", display: "flex", alignItems: "center", justifyContent: "center", gap: "5px" }}>
            🧪 カスタムドリンク
          </button>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px", marginBottom: "16px" }}>
          {NUTRITION_PRESETS.map(preset => {
            const selected = nutritionItems.find(i => i.id === preset.id);
            const qtyStep = preset.unit === "ml" ? (preset.defaultQty >= 150 ? 100 : 50) : 1;
            return (
              <div key={preset.id} onClick={() => toggleNutrition(preset.id)} style={{
                padding: "12px 10px", borderRadius: "14px", cursor: "pointer",
                background: selected ? "rgba(34,197,94,0.1)" : "rgba(30,41,59,0.5)",
                border: `1px solid ${selected ? "rgba(34,197,94,0.4)" : "rgba(148,163,184,0.08)"}`,
              }}>
                <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: selected ? "8px" : 0 }}>
                  <span style={{ fontSize: "20px" }}>{preset.icon}</span>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: "13px", fontWeight: "700", color: selected ? "#4ade80" : "#e2e8f0", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{preset.name}</div>
                    <div style={{ fontSize: "11px", color: "#94a3b8" }}>
                      {preset.carbs > 0 ? `糖${preset.carbs}g ` : ""}{preset.sodium > 0 ? `Na${preset.sodium}mg` : ""}
                    </div>
                  </div>
                  {selected && <div style={{ width: "15px", height: "15px", borderRadius: "50%", background: "#22c55e", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "8px", flexShrink: 0 }}>✓</div>}
                </div>
                {selected && (
                  <div onClick={e => e.stopPropagation()}>
                    <div style={{ display: "flex", alignItems: "center", gap: "5px" }}>
                      <button onClick={() => updateQty(preset.id, Math.max(0, selected.qty - qtyStep))}
                        style={{ width: "22px", height: "22px", borderRadius: "6px", border: "none", background: "rgba(148,163,184,0.15)", color: "#94a3b8", cursor: "pointer", fontSize: "14px" }}>−</button>
                      <span style={{ fontSize: "13px", fontWeight: "700", color: "#f1f5f9", flex: 1, textAlign: "center" }}>{selected.qty}{preset.unit}</span>
                      <button onClick={() => updateQty(preset.id, selected.qty + qtyStep)}
                        style={{ width: "22px", height: "22px", borderRadius: "6px", border: "none", background: "rgba(34,197,94,0.15)", color: "#4ade80", cursor: "pointer", fontSize: "14px" }}>＋</button>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
          {/* Product DB items added via search */}
          {nutritionItems.filter(item => item.id.startsWith("db_") || item.id.startsWith("custom_drink_")).map(item => (
            <div key={item.id} style={{ padding: "12px 10px", borderRadius: "14px", background: "rgba(99,102,241,0.1)", border: "1px solid rgba(99,102,241,0.3)" }}>
              <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "8px" }}>
                <span style={{ fontSize: "18px" }}>{item.id.startsWith("db_") ? (PRODUCT_DATABASE.find(p => p.id === item.id)?.icon || "🏷️") : "🧪"}</span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: "12px", fontWeight: "700", color: "#a5b4fc", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{item.name}</div>
                  <div style={{ fontSize: "10px", color: "#64748b" }}>{item.carbs > 0 ? `糖${item.carbs}g ` : ""}{item.sodium > 0 ? `Na${item.sodium}mg` : ""}</div>
                </div>
                <button onClick={() => removeProductItem(item.id)} style={{ width: "20px", height: "20px", borderRadius: "5px", border: "none", background: "rgba(239,68,68,0.15)", color: "#ef4444", cursor: "pointer", fontSize: "12px", flexShrink: 0 }}>×</button>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: "5px" }}>
                <button onClick={() => updateQty(item.id, Math.max(1, item.qty - 1))} style={{ width: "22px", height: "22px", borderRadius: "6px", border: "none", background: "rgba(148,163,184,0.15)", color: "#94a3b8", cursor: "pointer", fontSize: "14px" }}>−</button>
                <span style={{ fontSize: "13px", fontWeight: "700", color: "#f1f5f9", flex: 1, textAlign: "center" }}>{item.qty}{item.unit}</span>
                <button onClick={() => updateQty(item.id, item.qty + 1)} style={{ width: "22px", height: "22px", borderRadius: "6px", border: "none", background: "rgba(99,102,241,0.15)", color: "#818cf8", cursor: "pointer", fontSize: "14px" }}>＋</button>
              </div>
            </div>
          ))}
        </div>
        {nutritionItems.length > 0 && <NutritionTotals items={nutritionItems} />}

        {/* Feeling */}
        <div style={{ fontSize: "13px", fontWeight: "700", color: "#94a3b8", letterSpacing: "1px", textTransform: "uppercase", margin: "20px 0 12px" }}>体調</div>
        <div style={{ ...cardBase, marginBottom: "16px", padding: "14px 16px" }}>
          <div style={{ display: "flex", gap: "6px" }}>
            {FEELING_OPTIONS.map(f => (
              <button key={f.val} onClick={() => setFeeling(f.val)} style={{
                flex: 1, padding: "8px 4px", borderRadius: "10px", border: "none", cursor: "pointer",
                background: feeling === f.val ? "rgba(34,197,94,0.15)" : "rgba(30,41,59,0.4)",
                border: `1px solid ${feeling === f.val ? "rgba(34,197,94,0.4)" : "rgba(148,163,184,0.06)"}`,
                display: "flex", flexDirection: "column", alignItems: "center", gap: "3px",
              }}>
                <span style={{ fontSize: "20px" }}>{f.icon}</span>
                <span style={{ fontSize: "9px", color: feeling === f.val ? "#4ade80" : "#475569" }}>{f.label}</span>
              </button>
            ))}
          </div>
        </div>

        {/* Symptoms */}
        <div style={{ fontSize: "13px", fontWeight: "700", color: "#94a3b8", letterSpacing: "1px", textTransform: "uppercase", marginBottom: "12px" }}>症状</div>
        <div style={{ display: "flex", flexDirection: "column", gap: "6px", marginBottom: "24px" }}>
          {SYMPTOM_OPTIONS.map(opt => {
            const sel = symptoms.find(s => s.id === opt.id);
            return (
              <div key={opt.id} onClick={() => toggleSymptom(opt.id)} style={{
                display: "flex", alignItems: "center", gap: "12px", padding: "10px 14px", borderRadius: "12px", cursor: "pointer",
                background: sel ? (opt.id === "none" ? "rgba(34,197,94,0.08)" : "rgba(239,68,68,0.08)") : "rgba(30,41,59,0.4)",
                border: `1px solid ${sel ? (opt.id === "none" ? "rgba(34,197,94,0.3)" : "rgba(239,68,68,0.2)") : "rgba(148,163,184,0.06)"}`,
              }}>
                <span style={{ fontSize: "20px" }}>{opt.icon}</span>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: "13px", fontWeight: "600", color: "#e2e8f0" }}>{opt.label}</div>
                  {opt.cause && <div style={{ fontSize: "10px", color: "#64748b" }}>{opt.cause}</div>}
                </div>
                <div style={{
                  width: "18px", height: "18px", borderRadius: "5px", border: "2px solid",
                  borderColor: sel ? (opt.id === "none" ? "#22c55e" : "#ef4444") : "rgba(148,163,184,0.2)",
                  background: sel ? (opt.id === "none" ? "#22c55e" : "#ef4444") : "transparent",
                  display: "flex", alignItems: "center", justifyContent: "center", fontSize: "9px",
                }}>{sel ? "✓" : ""}</div>
              </div>
            );
          })}
        </div>

        <button onClick={handleSave} style={{
          width: "100%", padding: "16px", borderRadius: "14px", border: "none",
          background: "linear-gradient(135deg, #22c55e, #059669)",
          color: "#fff", fontSize: "15px", fontWeight: "800", cursor: "pointer",
          boxShadow: "0 8px 24px rgba(34,197,94,0.3)",
        }}>分析を更新する 🔬</button>
      </div>
    </div>
  );
}

// ─── Activity Card ───────────────────────────────────────────────────────────
function ActivityCard({ activity, onEdit }) {
  const { runData, analysis } = activity;
  const score = analysis?.overallScore;
  const scoreColor = score >= 80 ? "#4ade80" : score >= 55 ? "#fbbf24" : "#f87171";
  return (
    <div style={{ ...cardBase, marginBottom: "10px", padding: "14px 16px" }}>
      <div style={{ display: "flex", alignItems: "flex-start", gap: "10px" }}>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: "13px", fontWeight: "700", color: "#f1f5f9", marginBottom: "6px" }}>
            {runData.title || "トレーニングラン"}
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: "10px", fontSize: "11px", color: "#94a3b8" }}>
            <span>📍 {Math.round((runData.dist || 0) * 10) / 10}km</span>
            <span>⏱ {fmt(runData.durationMins)}</span>
            {runData.ascent > 0 && <span>↑{runData.ascent}m</span>}
            {runData.avgHR > 0 && <span>❤️ {runData.avgHR}bpm</span>}
          </div>
        </div>
        {score != null && (
          <div style={{ textAlign: "center", flexShrink: 0 }}>
            <div style={{ fontSize: "10px", color: "#64748b", marginBottom: "2px" }}>スコア</div>
            <div style={{ fontSize: "20px", fontWeight: "900", color: scoreColor }}>{score}</div>
          </div>
        )}
      </div>
      {onEdit && (
        <div style={{ marginTop: "10px", paddingTop: "10px", borderTop: "1px solid rgba(148,163,184,0.06)" }}>
          <button onClick={e => { e.stopPropagation(); onEdit(); }} style={{
            width: "100%", padding: "8px", borderRadius: "10px", border: "none",
            background: (!activity.nutritionItems || activity.nutritionItems.length === 0)
              ? "rgba(99,102,241,0.15)" : "rgba(30,41,59,0.4)",
            color: (!activity.nutritionItems || activity.nutritionItems.length === 0)
              ? "#a5b4fc" : "#64748b",
            fontSize: "12px", fontWeight: "700", cursor: "pointer",
          }}>
            {(!activity.nutritionItems || activity.nutritionItems.length === 0) ? "📝 補給を記録する" : "✏️ 補給を編集"}
          </button>
        </div>
      )}
    </div>
  );
}

  const totalMins  = activities.reduce((s, a) => s + (a.runData?.durationMins || 0), 0);
  const latestScore = activities.length > 0 ? (activities[activities.length - 1].analysis?.overallScore ?? "–") : "–";
  const runTypeLabel = runType === "trail" ? "🏔️ トレイルラン" : runType === "road" ? "🏙️ ロードラン" : "🔄 マルチスポーツ";

  const now = new Date();
  const cutoff = period === "weekly"
    ? new Date(now - 7  * 24 * 60 * 60 * 1000)
    : new Date(now - 30 * 24 * 60 * 60 * 1000);

  const bg   = "linear-gradient(165deg, #0a0e17 0%, #111827 40%, #1a1a2e 100%)";

      {/* Header */}
      <div style={{ padding: "28px 20px 0", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "2px" }}>
